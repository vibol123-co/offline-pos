<script>
  const State = { data: null, cart: [], activeScreen: "dashboard", loading: false, orderCurrency: "USD", ready: {} };
  // Which data sections each page needs. The open page loads first; the rest load in the background.
  const PAGE_SECTIONS = {
    dashboard: ["orders", "stock"],
    "new-order": ["catalog", "customers"],
    orders: ["orders"],
    products: ["catalog"],
    suppliers: ["suppliers"],
    stock: ["catalog", "stock", "suppliers"],
    reports: [],
    settings: ["staff"]
  };
  const ALL_SECTIONS = ["orders", "stock", "catalog", "customers", "suppliers", "staff"];
  const CURRENCY_EXPONENTS = { USD: 2, KHR: 0 };
  const DATABASE_NAME = "bakery-pos-github";
  const API_CONFIG = window.BAKERY_POS_CONFIG || {};
  const API_SCOPES = [
    "https://www.googleapis.com/auth/script.projects",
    "https://www.googleapis.com/auth/spreadsheets",
    "https://www.googleapis.com/auth/userinfo.email",
    "https://www.googleapis.com/auth/drive",
    "https://www.googleapis.com/auth/script.scriptapp"
  ].join(" ");
  let databasePromise;
  let sectionChain = Promise.resolve();
  let refreshInFlight = null;
  let refreshQueued = false;
  let lastRefreshAt = 0;
  let customerLookupTimer;
  let customerLookupSequence = 0;
  let matchedCustomer;
  let tokenClient;
  let tokenRequest;
  let accessToken = "";
  let accessTokenExpiresAt = 0;
  let firstTokenRequest = true;
  let staffSessionToken = "";
  let staffLoginDisabled = false;
  const STAFF_LOGIN_DISABLED_TOKEN = "staff-login-disabled";
  const NO_SESSION_METHODS = ["loginStaff", "getAuthConfig"];

  const DataService = Object.freeze({
    getAuthConfig(options) {
      return callServer_("getAuthConfig", [options || {}]);
    },
    loginStaff(username, password, options) {
      return callServer_("loginStaff", [username, password, options || {}]);
    },
    getSections(names, options) {
      return callServer_("getSections", [names, options || {}]);
    },
    getOrderHistory(params) {
      return callServer_("getOrderHistory", [params]);
    },
    logoutStaff() {
      return callServer_("logoutStaff", []);
    },
    async getAppData() {
      return callServer_("getAppData", []);
    },
    getReports(payload) {
      return callServer_("getReports", [payload]);
    },
    getPriceHistory(itemId) {
      return callServer_("getPriceHistory", [itemId]);
    },
    findCustomerByPhone(phone) {
      return callServer_("findCustomerByPhone", [phone]);
    },
    createOrder(payload, preview) {
      return mutate_("createOrder", [payload], preview);
    },
    updateOrderStatus(orderId, status) {
      return mutate_("updateOrderStatus", [orderId, status]);
    },
    recordPayment(orderId, payload) {
      return mutate_("recordPayment", [orderId, payload]);
    },
    createProduct(payload) {
      return mutate_("createProduct", [payload]);
    },
    createAddOn(payload) {
      return mutate_("createAddOn", [payload]);
    },
    createSupplier(payload) {
      return mutate_("createSupplier", [payload]);
    },
    createInventoryItem(payload) {
      return mutate_("createInventoryItem", [payload]);
    },
    recordSupplierPriceQuote(payload) {
      return mutate_("recordSupplierPriceQuote", [payload]);
    },
    receiveStock(payload) {
      return mutate_("receiveStock", [payload]);
    },
    adjustStock(payload) {
      return mutate_("adjustStock", [payload]);
    },
    updateSettings(payload) {
      return mutate_("updateSettings", [payload]);
    },
    listStaffAccess() {
      return callServer_("listStaffAccess", []);
    },
    updateStaffAccess(payload) {
      return mutate_("updateStaffAccess", [payload]);
    },
    async getPendingActions() {
      const db = await openDatabase_();
      return transactionRequest_(db, "outbox", "readonly", function(store) {
        return store.getAll();
      });
    },
    async flushPendingActions() {
      if (!navigator.onLine) return;
      const currentStaffId = State.data && State.data.currentUser
        ? State.data.currentUser.id : "";
      const actions = (await this.getPendingActions()).filter(function(action) {
        return currentStaffId && action.created_by === currentStaffId;
      }).sort(function(a, b) {
        return a.created_at.localeCompare(b.created_at);
      });
      for (const action of actions) {
        try {
          await callServer_(action.method, action.args);
          await removeQueuedAction_(action.request_id);
          window.dispatchEvent(new CustomEvent("bakery:queue-updated"));
        } catch (error) {
          window.dispatchEvent(new CustomEvent("bakery:queue-error", {
            detail: { requestId: action.request_id, message: error.message }
          }));
          break;
        }
      }
    }
  });

  function callServer_(method, args) {
    const needsSession = NO_SESSION_METHODS.indexOf(method) === -1;
    if (needsSession && !staffSessionToken) {
      return Promise.reject(new Error("Sign in to Bakery POS and try again."));
    }
    const parameters = !needsSession
      ? args
      : args.concat([staffSessionToken]);
    return getAccessToken_().then(function(token) {
      const endpoint = "https://script.googleapis.com/v1/scripts/" +
        encodeURIComponent(API_CONFIG.apiDeploymentId) + ":run";
      return fetch(endpoint, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ function: method, parameters: parameters })
      });
    }).then(function(response) {
      return response.json().then(function(result) {
        if (!response.ok) {
          throw new Error(result.error && result.error.message
            ? result.error.message : "The Google Apps Script API request failed.");
        }
        if (result.error) {
          const details = result.error.details || [];
          const message = details.length && details[0].errorMessage
            ? details[0].errorMessage : result.error.message;
          throw new Error(message || "The Apps Script function failed.");
        }
        return result.response ? result.response.result : undefined;
      });
    });
  }

  function getAccessToken_() {
    if (accessToken && Date.now() < accessTokenExpiresAt - 360000) {
      return Promise.resolve(accessToken);
    }
    if (tokenRequest) return tokenRequest;
    if (!API_CONFIG.oauthClientId || !API_CONFIG.apiDeploymentId) {
      return Promise.reject(new Error(
        "The POS Google API settings are not configured. Contact the administrator."
      ));
    }
    tokenRequest = waitForGoogleIdentity_().then(function() {
      return new Promise(function(resolve, reject) {
        if (!tokenClient) {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: API_CONFIG.oauthClientId,
            scope: API_SCOPES,
            callback: function(response) {
              if (response.error || !response.access_token) {
                reject(new Error(response.error_description || response.error ||
                  "Google sign-in was not completed."));
                return;
              }
              accessToken = response.access_token;
              accessTokenExpiresAt = Date.now() + Number(response.expires_in || 3600) * 1000;
              firstTokenRequest = false;
              resolve(accessToken);
            },
            error_callback: function(error) {
              reject(new Error(error && error.message
                ? error.message : "Google sign-in was not completed."));
            }
          });
        } else {
          tokenClient.callback = function(response) {
            if (response.error || !response.access_token) {
              reject(new Error(response.error_description || response.error ||
                "Google sign-in was not completed."));
              return;
            }
            accessToken = response.access_token;
            accessTokenExpiresAt = Date.now() + Number(response.expires_in || 3600) * 1000;
            firstTokenRequest = false;
            resolve(accessToken);
          };
        }
        tokenClient.requestAccessToken({ prompt: firstTokenRequest ? "select_account" : "" });
      });
    }).finally(function() {
      tokenRequest = null;
    });
    return tokenRequest;
  }

  function waitForGoogleIdentity_() {
    return new Promise(function(resolve, reject) {
      const startedAt = Date.now();
      const poll = function() {
        if (window.google && google.accounts && google.accounts.oauth2) {
          resolve();
        } else if (Date.now() - startedAt > 10000) {
          reject(new Error("Google sign-in could not load. Check your internet connection."));
        } else {
          window.setTimeout(poll, 100);
        }
      };
      poll();
    });
  }

  async function mutate_(method, args, preview) {
    const requestId = createRequestId_();
    const callArgs = args.concat([requestId]);
    try {
      return await callServer_(method, callArgs);
    } catch (error) {
      if (!navigator.onLine && State.data && State.data.currentUser) {
        const action = {
          request_id: requestId,
          method: method,
          args: callArgs,
          preview: preview || null,
          created_by: State.data.currentUser.id,
          created_at: new Date().toISOString()
        };
        await putQueuedAction_(action);
        window.dispatchEvent(new CustomEvent("bakery:queue-updated"));
        return { queued: true, request_id: requestId };
      }
      throw error;
    }
  }

  function createRequestId_() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    return "req_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  }

  function openDatabase_() {
    if (databasePromise) return databasePromise;
    databasePromise = new Promise(function(resolve, reject) {
      const request = indexedDB.open(DATABASE_NAME, 1);
      request.onupgradeneeded = function() {
        const db = request.result;
        if (!db.objectStoreNames.contains("outbox")) {
          db.createObjectStore("outbox", { keyPath: "request_id" });
        }
      };
      request.onsuccess = function() { resolve(request.result); };
      request.onerror = function() { reject(request.error); };
    });
    return databasePromise;
  }

  function transactionRequest_(db, storeName, mode, action) {
    return new Promise(function(resolve, reject) {
      const transaction = db.transaction(storeName, mode);
      const request = action(transaction.objectStore(storeName));
      request.onsuccess = function() { resolve(request.result); };
      request.onerror = function() { reject(request.error); };
      transaction.onabort = function() { reject(transaction.error); };
    });
  }

  async function putQueuedAction_(action) {
    const db = await openDatabase_();
    return transactionRequest_(db, "outbox", "readwrite", function(store) {
      return store.put(action);
    });
  }

  async function removeQueuedAction_(requestId) {
    const db = await openDatabase_();
    return transactionRequest_(db, "outbox", "readwrite", function(store) {
      return store.delete(requestId);
    });
  }

  function byId(id) { return document.getElementById(id); }
  function text(element, value) { element.textContent = value == null ? "" : String(value); }
  function element(tag, className, value) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = value;
    return node;
  }

  let noticeTimer_ = null;

  function showNotice(message, isError, isLoading) {
    const notice = byId("notice");
    notice.replaceChildren();
    if (isLoading) notice.append(element("span", "inline-spinner"));
    notice.append(document.createTextNode(message));
    notice.classList.toggle("error", Boolean(isError));
    notice.classList.toggle("loading", Boolean(isLoading));
    // Presentation: the toast hides itself (errors stay longer; "working" toasts stay until replaced).
    if (noticeTimer_) window.clearTimeout(noticeTimer_);
    if (!isLoading) {
      noticeTimer_ = window.setTimeout(function() {
        if (notice.textContent === message) notice.replaceChildren();
      }, isError ? 9000 : 5000);
    }
  }

  function moneyFromMinor(amountMinor, currency) {
    const exponent = CURRENCY_EXPONENTS[currency] || 0;
    const amount = Number(amountMinor || 0) / Math.pow(10, exponent);
    return new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: currency,
      minimumFractionDigits: exponent,
      maximumFractionDigits: exponent
    }).format(amount);
  }

  function moneyFromMajor(value, currency) {
    const exponent = CURRENCY_EXPONENTS[currency] || 0;
    return new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: currency,
      minimumFractionDigits: exponent,
      maximumFractionDigits: exponent
    }).format(Number(value || 0));
  }

  // ---- Exchange rate: mirrors Currency.gs on the server. Keep the two in step. ----
  const Fx = {
    rate(settings) {
      const value = Number(((settings || (State.data && State.data.settings)) || {}).khr_per_usd || 0);
      return Number.isInteger(value) && value > 0 ? value : 0;
    },
    step(settings) {
      const value = Number(((settings || (State.data && State.data.settings)) || {}).khr_rounding_riel || 100);
      return Number.isInteger(value) && value >= 1 ? value : 100;
    },
    roundKhr(riel, step) {
      return Math.round(Number(riel) / step) * step;
    },
    // null when the currencies differ and no rate is set.
    convert(amountMinor, from, to, rate) {
      const amount = Number(amountMinor || 0);
      if (from === to) return amount;
      if (!rate) return null;
      return from === "USD" ? Math.round(amount * rate / 100) : Math.round(amount * 100 / rate);
    },
    // Display equivalent: KHR figures are rounded to the cash step.
    equivalent(amountMinor, from, to, rate, step) {
      const converted = Fx.convert(amountMinor, from, to, rate);
      if (converted === null) return null;
      return to === "KHR" && from !== to ? Fx.roundKhr(converted, step) : converted;
    },
    // Price of a catalog item in the order currency ("" when it has none).
    catalogPrice(record, currency) {
      if (currency === "USD") return record.price_usd_minor;
      const rate = Fx.rate();
      const usd = record.price_usd_minor;
      if (rate && usd !== "" && usd !== null && usd !== undefined) {
        return Fx.roundKhr(Number(usd) * rate / 100, Fx.step());
      }
      return record.price_khr_minor;
    },
    // Same result as settleReceived_ in Currency.gs. Returns { error } instead of throwing.
    settle(receivedMinor, receivedCurrency, dueMinor, orderCurrency, settings) {
      const rate = Fx.rate(settings);
      const step = Fx.step(settings);
      if (receivedCurrency !== orderCurrency && !rate) {
        return { error: "Set the KHR exchange rate in Settings before mixing USD and KHR." };
      }
      const received = Number(receivedMinor || 0);
      const due = Math.max(Number(dueMinor || 0), 0);
      const dueInReceived = Fx.equivalent(due, orderCurrency, receivedCurrency, rate, step);
      let applied;
      let change;
      if (received >= dueInReceived) {
        applied = due;
        change = received - dueInReceived;
      } else {
        applied = Math.min(Fx.convert(received, receivedCurrency, orderCurrency, rate), due);
        change = 0;
      }
      return {
        received_minor: received,
        received_currency: receivedCurrency,
        due_in_received_currency_minor: dueInReceived,
        applied_minor: applied,
        change_minor: change,
        change: Fx.changeBoth(change, receivedCurrency, rate, step),
        exchange_rate_khr_per_usd: rate
      };
    },
    changeBoth(changeMinor, currency, rate, step) {
      const amount = Number(changeMinor || 0);
      if (currency === "USD") {
        return { usd_minor: amount, khr_minor: rate ? Fx.roundKhr(amount * rate / 100, step) : null };
      }
      return { usd_minor: rate ? Math.round(amount * 100 / rate) : null, khr_minor: Fx.roundKhr(amount, step) };
    },
    // "$7.63 / ៛31,300" style text; skips a currency that cannot be calculated.
    bothText(usdMinor, khrMinor) {
      const parts = [];
      if (usdMinor !== null && usdMinor !== undefined) parts.push(moneyFromMinor(usdMinor, "USD"));
      if (khrMinor !== null && khrMinor !== undefined) parts.push(moneyFromMinor(khrMinor, "KHR"));
      return parts.join(" / ");
    }
  };

  function formatQuantity(milli) {
    return (Number(milli || 0) / 1000).toLocaleString("en-US", { maximumFractionDigits: 3 });
  }

  function setConnectionState(offline) {
    const status = byId("connection-status");
    status.classList.toggle("offline", offline);
    status.classList.remove("pending");
    text(status, offline ? "Offline (current session only)" : "Connected to shop data");
    byId("offline-banner").hidden = !offline;
    updateSyncPill_();
  }

  function setSignedOutStatus_() {
    const status = byId("connection-status");
    status.classList.remove("offline");
    status.classList.add("pending");
    text(status, "Sign in required");
    byId("offline-banner").hidden = true;
    updateSyncPill_();
  }

  function emptyData_() {
    return {
      currentUser: null,
      settings: { default_currency: "USD", tax_rate_basis_points: 0, khr_per_usd: 0, khr_rounding_riel: 100 },
      products: [], addOns: [], inventoryItems: [], suppliers: [], stock: [],
      orders: [], openOrders: [], customers: [], staffAccess: [], ordersRange: null, shopToday: ""
    };
  }

  function sectionsForPage_(page) {
    return PAGE_SECTIONS[page] || [];
  }

  // Merges a server reply from getSections/loginStaff into State and redraws only what changed.
  function applySections_(reply, requested) {
    if (!reply) return;
    if (!State.data) State.data = emptyData_();
    const userChanged = !State.data.currentUser ||
      JSON.stringify(State.data.currentUser) !== JSON.stringify(reply.currentUser);
    State.data.currentUser = reply.currentUser;
    State.data.settings = reply.settings || State.data.settings;
    State.data.shopToday = reply.shopToday || State.data.shopToday;
    const sections = reply.sections || {};
    const changed = Object.keys(sections);
    if (sections.catalog) {
      State.data.products = sections.catalog.products;
      State.data.addOns = sections.catalog.addOns;
      State.data.inventoryItems = sections.catalog.inventoryItems;
    }
    if (sections.orders) {
      State.data.orders = sections.orders.orders;
      State.data.openOrders = sections.orders.openOrders;
      State.data.ordersRange = sections.orders.range;
    }
    if (sections.customers) State.data.customers = sections.customers.customers;
    if (sections.stock) State.data.stock = sections.stock.stock;
    if (sections.suppliers) State.data.suppliers = sections.suppliers.suppliers;
    if (sections.staff) State.data.staffAccess = sections.staff.staffAccess;
    // Sections the user may not see come back empty: mark them done so no spinner waits forever.
    (requested || []).concat(changed).forEach(function(name) { State.ready[name] = true; });
    if (userChanged) applyPageAccess_();
    renderSections_(changed, true);
    updateLoadingStates_();
  }

  const SECTION_RENDERERS = {
    catalog: function() { renderProducts(); renderAddOns(); populateSelects(); renderItemCards(); renderCart(); },
    orders: function() { renderDashboard(); renderOrders(); },
    customers: function() {},
    stock: function() { renderDashboard(); renderStock(); },
    suppliers: function() { renderSuppliers(); populateSelects(); },
    staff: function() { renderSettings(); }
  };

  function renderSections_(names, includeSettings) {
    if (!State.data) return;
    const done = {};
    names.forEach(function(name) {
      const renderer = SECTION_RENDERERS[name];
      if (renderer && !done[name]) { done[name] = true; renderer(); }
    });
    if (includeSettings) {
      renderSettings();
      if (!State.cart.length) {
        State.orderCurrency = State.data.settings.default_currency || "USD";
        byId("order-currency").value = State.orderCurrency;
        if (!receivedEdited) {
          byId("order-form").elements.received_currency.value = State.orderCurrency;
          setReceivedStep_();
        }
      }
      renderOrderTotals();
    }
  }

  // Shows a spinner on any page whose data has not arrived yet.
  function updateLoadingStates_() {
    document.querySelectorAll(".screen").forEach(function(screen) {
      const page = screen.id.replace("screen-", "");
      const waiting = sectionsForPage_(page).some(function(name) { return !State.ready[name]; });
      screen.classList.toggle("is-loading", waiting);
    });
  }

  function addLoadingPlaceholders_() {
    document.querySelectorAll(".screen").forEach(function(screen) {
      if (screen.querySelector(".screen-loading")) return;
      const placeholder = element("div", "screen-loading");
      placeholder.setAttribute("role", "status");
      placeholder.append(element("span", "inline-spinner"));
      placeholder.append(document.createTextNode("Loading…"));
      const heading = screen.querySelector(":scope > .screen-heading");
      if (heading) heading.after(placeholder); else screen.prepend(placeholder);
    });
  }

  // Loads sections one request at a time, in order. Sections already loaded are skipped unless
  // force is set (refresh).
  function loadSections_(names, options) {
    const opts = options || {};
    const run = async function() {
      const wanted = names.filter(function(name) {
        return opts.force || !State.ready[name];
      });
      if (!wanted.length) return true;
      const range = State.data && State.data.ordersRange;
      const reply = await DataService.getSections(wanted, {
        fresh: Boolean(opts.fresh),
        optional: opts.optional || [],
        ordersFrom: range ? range.from : "",
        ordersTo: range ? range.to : ""
      });
      applySections_(reply, wanted);
      return true;
    };
    sectionChain = sectionChain.then(run, run);
    return sectionChain;
  }

  function loadRemainingSections_() {
    const rest = ALL_SECTIONS.filter(function(name) { return !State.ready[name]; });
    if (!rest.length) return Promise.resolve(true);
    return loadSections_(rest).catch(function(error) {
      showNotice("Some data could not load: " + error.message + " Tap refresh to try again.", true);
      ALL_SECTIONS.forEach(function(name) { State.ready[name] = true; });
      updateLoadingStates_();
      return false;
    });
  }

  // Reloads data: the open page first, everything else quietly afterwards. A refresh asked for
  // while another one runs is queued, so it is never silently skipped.
  async function refreshData(silent, options) {
    const opts = options || {};
    if (refreshInFlight) {
      refreshQueued = true;
      return refreshInFlight;
    }
    State.loading = true;
    window.setTimeout(updateSyncPill_, 0); // presentation: pill shows "Refreshing…"
    refreshInFlight = (async function() {
      try {
        const active = sectionsForPage_(State.activeScreen);
        await loadSections_(active.length ? active : ["catalog"], { force: true, fresh: Boolean(opts.fresh) });
        lastRefreshAt = Date.now();
        setConnectionState(!navigator.onLine);
        const rest = ALL_SECTIONS.filter(function(name) { return active.indexOf(name) === -1; });
        loadSections_(rest, { force: true }).catch(function(error) {
          showNotice(error.message, true);
        });
        if (!silent) showNotice("Data refreshed.");
        await updateQueueStatus();
        return true;
      } catch (error) {
        setConnectionState(!navigator.onLine);
        showNotice(error.message, true);
        return false;
      }
    })();
    try {
      return await refreshInFlight;
    } finally {
      refreshInFlight = null;
      State.loading = false;
      updateSyncPill_();
      if (refreshQueued) {
        refreshQueued = false;
        refreshData(true);
      }
    }
  }

  // Quiet refresh when the user comes back to the app, only if the Google token is still valid
  // (a new token needs a tap, which a background refresh cannot do).
  function refreshOnReturn_() {
    if (document.visibilityState !== "visible" || !State.data || !State.data.currentUser) return;
    if (!navigator.onLine || Date.now() - lastRefreshAt < 60000) return;
    if (!accessToken || Date.now() > accessTokenExpiresAt - 120000) return;
    refreshData(true);
  }

  function showScreen(name) {
    const user = State.data && State.data.currentUser;
    if (user && user.allowed_pages.indexOf(name) === -1) return;
    State.activeScreen = name;
    rememberSession_(staffSessionToken, name);
    document.querySelectorAll(".screen").forEach(function(screen) {
      screen.hidden = screen.id !== "screen-" + name;
    });
    document.querySelectorAll(".nav-button").forEach(function(button) {
      button.classList.toggle("active", button.dataset.screen === name);
    });
    updateLoadingStates_();
    const missing = sectionsForPage_(name).filter(function(section) { return !State.ready[section]; });
    if (missing.length && State.data && State.data.currentUser) {
      loadSections_(missing).catch(function(error) { showNotice(error.message, true); });
    }
    if (name === "stock" && State.data && State.ready.catalog) {
      loadPriceHistory();
    }
  }

  function applyPageAccess_() {
    const user = State.data.currentUser;
    const allowed = user && Array.isArray(user.allowed_pages) ? user.allowed_pages : [];
    document.querySelectorAll(".nav-button").forEach(function(button) {
      button.hidden = allowed.indexOf(button.dataset.screen) === -1;
    });
    document.querySelectorAll(".screen").forEach(function(screen) {
      const page = screen.id.replace("screen-", "");
      screen.hidden = allowed.indexOf(page) === -1 || page !== State.activeScreen;
    });
    const userLabel = byId("user-label");
    text(userLabel, user
      ? (user.display_name || user.username) + " · " + (user.role === "admin" ? "Admin" : "Cashier")
      : "");
    userLabel.hidden = !user;
    // Presentation: avatar initials, and hide shortcut buttons to pages this user can't open.
    const avatar = byId("user-avatar");
    const displayName = user ? String(user.display_name || user.username || "") : "";
    avatar.textContent = displayName.split(/\s+/).filter(Boolean).slice(0, 2)
      .map(function(part) { return part.charAt(0).toUpperCase(); }).join("") || "?";
    avatar.hidden = !user;
    document.querySelectorAll("[data-goto]").forEach(function(button) {
      button.hidden = allowed.indexOf(button.dataset.goto) === -1;
    });
    if (allowed.indexOf(State.activeScreen) === -1) {
      State.activeScreen = allowed[0] || "";
      document.querySelectorAll(".screen").forEach(function(screen) {
        screen.hidden = screen.id !== "screen-" + State.activeScreen;
      });
    }
    document.querySelectorAll(".nav-button").forEach(function(button) {
      button.classList.toggle("active", button.dataset.screen === State.activeScreen);
    });
  }

  function renderDashboard() {
    const today = new Date().toDateString();
    const orders = State.data.orders || [];
    const todays = orders.filter(function(order) {
      return new Date(order.created_at).toDateString() === today && order.status !== "cancelled";
    });
    const completedToday = todays.filter(function(order) { return order.status === "completed"; });
    byId("kpi-orders").textContent = String(todays.length);
    ["USD", "KHR"].forEach(function(currency) {
      const sum = completedToday.filter(function(order) { return order.currency === currency; })
        .reduce(function(total, order) { return total + Number(order.total_minor || 0); }, 0);
      text(byId(currency === "USD" ? "kpi-sales-usd" : "kpi-sales-khr"), moneyFromMinor(sum, currency));
    });
    const lowStock = (State.data.stock || []).filter(function(item) { return item.is_low; });
    text(byId("kpi-low-stock"), String(lowStock.length));
    byId("kpi-low-stock-card").classList.toggle("warn", lowStock.length > 0);
    text(byId("dashboard-date"), "Today · " + new Date().toLocaleDateString(undefined, {
      weekday: "long", day: "numeric", month: "long"
    }));
    const attention = orders.concat(State.data.openOrders || []).filter(function(order) {
      return ["new", "preparing", "ready"].includes(order.status);
    }).sort(function(left, right) {
      return String(right.created_at).localeCompare(String(left.created_at));
    }).slice(0, 8);
    const container = byId("dashboard-orders");
    container.replaceChildren();
    if (!attention.length) {
      container.append(element("p", "muted", "No orders need attention."));
    }
    const canChangeOrders = Boolean(State.data.currentUser &&
      State.data.currentUser.allowed_pages.indexOf("orders") !== -1);
    attention.forEach(function(order) {
      // Presentation: row opens the order; the inline button is the same next step as on Orders.
      const row = element("div", "compact-row" + (isOrderOverdue_(order) ? " overdue" : ""));
      const open = element("button", "row-open");
      open.type = "button";
      open.append(element("b", "", order.order_number + " · " + (order.customer_name || "Walk-in")));
      open.append(element("p", "", orderTypeLabel_(order.order_type) +
        (order.pickup_at ? " · pickup " + new Date(order.pickup_at).toLocaleString(undefined, {
          day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit"
        }) : "") + (isOrderOverdue_(order) ? " · overdue" : "")));
      open.addEventListener("click", function() { openOrderDetail(order.id); });
      row.append(open);
      row.append(element("span", "status status-" + order.status, order.status));
      const next = { new: "preparing", preparing: "ready", ready: "completed" }[order.status];
      if (next && canChangeOrders && !pendingOrderSaves[order.id]) {
        const label = { preparing: "Start preparing", ready: "Mark ready", completed: "Complete" }[next];
        const step = element("button", "btn btn-sm btn-secondary", label);
        step.type = "button";
        step.addEventListener("click", function() {
          changeOrderStatus_(order, next, step, "Saving…", "Order status updated.");
        });
        row.append(step);
      }
      container.append(row);
    });
    const stockContainer = byId("dashboard-stock");
    stockContainer.replaceChildren();
    if (!lowStock.length) stockContainer.append(element("p", "muted", "No low-stock items."));
    lowStock.slice(0, 8).forEach(function(item) {
      const row = element("div", "stockrow");
      row.append(element("b", "", item.name));
      row.append(element("span", "chip danger", formatQuantity(item.on_hand_milli) + " " + item.base_unit));
      stockContainer.append(row);
    });
    updateOrderAlerts_();
  }

  function renderSimpleRows(container, rows, emptyMessage) {
    container.replaceChildren();
    if (!rows.length) {
      container.append(element("p", "muted", emptyMessage));
      return;
    }
    rows.forEach(function(value) { container.append(element("div", "compact-row", value)); });
  }

  // ---- Orders page ----
  // OrderView holds what the Orders page shows. By default it is the live startup range
  // (yesterday + today); a date search replaces it with history results from the server.
  const OrderView = { range: null, orders: null, totalCount: 0, hasMore: false, live: true };

  function currentViewOrders_() {
    return OrderView.live ? (State.data.orders || []) : (OrderView.orders || []);
  }

  function allKnownOrders_() {
    const seen = {};
    const list = [];
    [State.data.orders || [], State.data.openOrders || [], OrderView.orders || []].forEach(function(group) {
      group.forEach(function(order) {
        if (!seen[order.id]) { seen[order.id] = true; list.push(order); }
      });
    });
    return list;
  }

  function findKnownOrder_(orderId) {
    return allKnownOrders_().find(function(order) { return order.id === orderId; }) || null;
  }

  // Puts an order returned by the server into every list that shows it, then redraws.
  function upsertLocalOrder_(order) {
    if (!order || !order.id || !State.data) return;
    const replaceIn = function(list) {
      const index = list.findIndex(function(existing) { return existing.id === order.id; });
      if (index !== -1) { list[index] = order; return true; }
      return false;
    };
    const inStartup = replaceIn(State.data.orders);
    replaceIn(State.data.openOrders);
    if (OrderView.orders) replaceIn(OrderView.orders);
    if (!inStartup && !State.data.openOrders.some(function(o) { return o.id === order.id; })) {
      const range = State.data.ordersRange;
      const day = shopDateOf_(order.created_at);
      if (!range || (day >= range.from && day <= range.to)) State.data.orders.unshift(order);
    }
    renderDashboard();
    renderOrders();
    refreshOrderDetail_(order.id);
  }

  function shopDateOf_(iso) {
    // Shop time zone is UTC+7 (Cambodia / Bangkok).
    const date = new Date(new Date(iso).getTime() + 7 * 60 * 60 * 1000);
    return date.toISOString().slice(0, 10);
  }

  function shopDateShift_(dateString, days) {
    const date = new Date(dateString + "T00:00:00Z");
    date.setUTCDate(date.getUTCDate() + days);
    return date.toISOString().slice(0, 10);
  }

  function shopToday_() {
    return shopDateOf_(new Date().toISOString());
  }

  function renderOrders() {
    const container = byId("orders-list");
    if (!container || !State.data) return;
    container.replaceChildren();
    const range = OrderView.live ? State.data.ordersRange : OrderView.range;
    if (range && document.activeElement !== byId("orders-from") && document.activeElement !== byId("orders-to")) {
      byId("orders-from").value = range.from;
      byId("orders-to").value = range.to;
    }
    renderOpenOrdersStrip_(range);
    const search = (byId("orders-search").value || "").trim().toLowerCase();
    const selectedStatus = byId("orders-status").value;
    const queued = OrderView.live ? getQueuedOrderPreviews() : [];
    const all = currentViewOrders_().filter(function(order) {
      const searchText = [order.order_number, order.customer_name, order.customer_phone]
        .join(" ").toLowerCase();
      return (!search || searchText.includes(search)) &&
        (!selectedStatus || order.status === selectedStatus);
    }).concat(queued);
    renderOrdersSummary_(all);
    byId("orders-more").hidden = OrderView.live || !OrderView.hasMore;
    if (!all.length) {
      container.append(element("p", "muted", "No matching orders."));
      return;
    }
    all.sort(function(left, right) {
      return String(right.created_at).localeCompare(String(left.created_at));
    }).forEach(function(order) {
      container.append(renderOrderCard(order));
    });
  }

  function renderOrdersSummary_(orders) {
    const active = orders.filter(function(order) { return order.status !== "cancelled"; });
    const totals = { USD: 0, KHR: 0 };
    active.forEach(function(order) {
      if (totals[order.currency] !== undefined) totals[order.currency] += Number(order.total_minor || 0);
    });
    const parts = [orders.length + " order" + (orders.length === 1 ? "" : "s")];
    if (totals.USD) parts.push(moneyFromMinor(totals.USD, "USD"));
    if (totals.KHR) parts.push(moneyFromMinor(totals.KHR, "KHR"));
    if (!OrderView.live && OrderView.totalCount > (OrderView.orders || []).length) {
      parts.push("showing " + (OrderView.orders || []).length + " of " + OrderView.totalCount);
    }
    text(byId("orders-summary"), parts.join(" · "));
  }

  // Unfinished orders created before the selected range, so none are forgotten.
  function renderOpenOrdersStrip_(range) {
    const strip = byId("open-orders-strip");
    const list = byId("open-orders-list");
    const from = range ? range.from : "";
    const open = allKnownOrders_().filter(function(order) {
      return ["new", "preparing", "ready"].includes(order.status) &&
        from && shopDateOf_(order.created_at) < from;
    }).sort(function(left, right) {
      return String(left.created_at).localeCompare(String(right.created_at));
    });
    strip.hidden = !open.length;
    list.replaceChildren();
    if (!open.length) return;
    text(byId("open-orders-title"), open.length + " open order" + (open.length === 1 ? "" : "s") +
      " from earlier days");
    open.forEach(function(order) {
      const chip = element("button", "open-order-chip");
      chip.type = "button";
      chip.append(element("strong", "", order.order_number));
      chip.append(element("span", "muted", new Date(order.created_at).toLocaleDateString(undefined, {
        weekday: "short", day: "numeric", month: "short"
      })));
      chip.append(element("span", "status status-" + order.status, order.status));
      chip.append(element("span", "", moneyFromMinor(order.total_minor || 0, order.currency)));
      chip.setAttribute("aria-label", "Open order " + order.order_number);
      chip.addEventListener("click", function() { openOrderDetail(order.id); });
      list.append(chip);
    });
  }

  function setQuickRange_(kind) {
    const today = State.data.shopToday || shopToday_();
    let from = today;
    let to = today;
    if (kind === "startup") {
      from = shopDateShift_(today, -1);
    } else if (kind === "week") {
      from = shopDateShift_(today, -6);
    } else if (kind === "month") {
      from = today.slice(0, 8) + "01";
    } else if (kind === "last-month") {
      const firstThis = today.slice(0, 8) + "01";
      to = shopDateShift_(firstThis, -1);
      from = to.slice(0, 8) + "01";
    }
    byId("orders-from").value = from;
    byId("orders-to").value = to;
    document.querySelectorAll(".quick-range").forEach(function(button) {
      button.classList.toggle("active", button.dataset.range === kind);
    });
  }

  async function searchOrderRange_(append) {
    const from = byId("orders-from").value;
    const to = byId("orders-to").value;
    if (!from || !to) throw new Error("Choose both dates.");
    if (to < from) throw new Error("The end date must be on or after the start date.");
    const startup = State.data.ordersRange;
    if (!append && startup && from === startup.from && to === startup.to) {
      OrderView.live = true;
      OrderView.orders = null;
      OrderView.range = null;
      renderOrders();
      return;
    }
    const offset = append ? (OrderView.orders || []).length : 0;
    const result = await DataService.getOrderHistory({ from: from, to: to, offset: offset });
    OrderView.live = false;
    OrderView.range = result.range;
    OrderView.orders = append ? (OrderView.orders || []).concat(result.orders) : result.orders;
    OrderView.totalCount = result.total_count;
    OrderView.hasMore = result.has_more;
    renderOrders();
  }

  // ---- Order detail ----
  let detailOrderId = "";

  function openOrderDetail(orderId) {
    const order = findKnownOrder_(orderId);
    if (!order) {
      showNotice("That order is not loaded. Search its date range on the Orders page.", true);
      return;
    }
    detailOrderId = orderId;
    renderOrderDetail_(order);
    const dialog = byId("order-detail-dialog");
    if (!dialog.open) dialog.showModal();
  }

  function refreshOrderDetail_(orderId) {
    if (!detailOrderId || detailOrderId !== orderId || !byId("order-detail-dialog").open) return;
    const order = findKnownOrder_(orderId);
    if (order) renderOrderDetail_(order);
  }

  function renderOrderDetail_(order) {
    text(byId("order-detail-title"), "Order " + (order.order_number || ""));
    const body = byId("order-detail-body");
    body.replaceChildren();
    body.append(renderOrderCard(order));
    let details = {};
    try { details = JSON.parse(order.custom_details_json || "{}"); } catch (error) { details = {}; }
    const detailKeys = Object.keys(details).filter(function(key) { return details[key]; });
    if (detailKeys.length || order.notes) {
      const extra = element("div", "panel");
      extra.append(element("h3", "", "Details"));
      if (order.notes) extra.append(element("p", "", "Notes: " + order.notes));
      detailKeys.forEach(function(key) {
        extra.append(element("p", "", key.replaceAll("_", " ") + ": " + details[key]));
      });
      body.append(extra);
    }
    const history = order.status_history || [];
    if (history.length) {
      body.append(element("h3", "", "Status history"));
      const list = element("ul", "order-history-list");
      history.forEach(function(entry) {
        list.append(element("li", "", new Date(entry.changed_at).toLocaleString() + " · " + entry.status));
      });
      body.append(list);
    }
    if ((order.payments || []).length) {
      body.append(element("h3", "", "Payments"));
      const list = element("ul", "order-history-list");
      order.payments.forEach(function(payment) {
        list.append(element("li", "", new Date(payment.paid_at || payment.created_at).toLocaleString() +
          " · " + moneyFromMinor(payment.amount_minor, payment.currency) + " · " +
          String(payment.method || "").replaceAll("_", " ")));
      });
      body.append(list);
    }
  }

  // Changes an order's status: the screen updates at once, the server confirms in the background,
  // and the change is undone with an error message if the server refuses it.
  const pendingOrderSaves = {};

  async function changeOrderStatus_(order, next, button, busyLabel, doneMessage) {
    if (pendingOrderSaves[order.id]) return;
    const previous = order.status;
    const optimistic = Object.assign({}, order, { status: next });
    setButtonBusy_(button, busyLabel);
    pendingOrderSaves[order.id] = busyLabel;
    upsertLocalOrder_(optimistic);
    try {
      const saved = await DataService.updateOrderStatus(order.id, next);
      if (saved && saved.queued) {
        showNotice("Saved on this device; it will sync when online.");
        return;
      }
      upsertLocalOrder_(saved);
      if (next === "cancelled") loadSections_(["stock"], { force: true }).catch(function() {});
      showNotice(doneMessage);
    } catch (error) {
      delete pendingOrderSaves[order.id];
      upsertLocalOrder_(Object.assign({}, order, { status: previous }));
      showNotice(error.message, true);
    } finally {
      clearButtonBusy_(button);
      if (pendingOrderSaves[order.id]) {
        delete pendingOrderSaves[order.id];
        renderOrders();
        renderDashboard();
        refreshOrderDetail_(order.id);
      }
    }
  }

  // Presentation: row = colour bar · customer/meta/items · status · money · actions.
  function renderOrderCard(order) {
    const overdue = isOrderOverdue_(order);
    const final = ["completed", "cancelled"].includes(order.status);
    const card = element("article", "order-card" + (overdue ? " overdue" : "") + (final ? " final" : "") +
      (order.status === "cancelled" ? " is-cancelled" : ""));
    card.append(element("span", "bar"));
    const main = element("div", "order-main");
    main.append(element("h3", "", order.customer_name || "Walk-in customer"));
    main.append(element("p", "order-meta",
      (order.order_number || "Pending sync") + " · " + order.order_channel + " · " + order.fulfillment_method +
      (order.created_at ? " · " + new Date(order.created_at).toLocaleString() : "") +
      (order.location ? " · " + order.location : "")));
    const list = element("ul", "order-items");
    (order.items || []).forEach(function(item) {
      list.append(element("li", "", item.name_snapshot + (item.variant ? " · " + item.variant : "") + " × " + item.quantity));
    });
    main.append(list);
    card.append(main);
    const statusBox = element("div", "order-status");
    statusBox.append(element("span", "status status-" + order.status, order.status.replaceAll("_", " ")));
    if (order.pickup_at) {
      const pickup = element("p", "order-meta", "Pickup " + new Date(order.pickup_at).toLocaleString());
      if (overdue) pickup.append(element("span", "overdue-text", " · overdue"));
      statusBox.append(pickup);
    }
    card.append(statusBox);
    const due = order.balance_due_minor === undefined ? Number(order.total_minor || 0) : Number(order.balance_due_minor);
    const money = element("div", "order-total");
    money.append(element("span", "", moneyFromMinor(order.total_minor || 0, order.currency)));
    if (order.status !== "cancelled") {
      money.append(due > 0
        ? element("span", "due", "due " + moneyFromMinor(due, order.currency))
        : element("span", "paid", "paid"));
    }
    card.append(money);
    const actions = element("div", "order-actions");
    if (order.request_id) {
      actions.append(element("span", "waiting", "Waiting to sync"));
    } else if (pendingOrderSaves[order.id]) {
      const saving = element("span", "muted saving-indicator");
      saving.append(element("span", "inline-spinner"), document.createTextNode(" " + pendingOrderSaves[order.id]));
      actions.append(saving);
    } else {
      const next = { new: "preparing", preparing: "ready", ready: "completed" }[order.status];
      if (next) {
        const label = { preparing: "Start preparing", ready: "Mark ready", completed: "Complete" }[next];
        const statusButton = element("button", "btn btn-sm btn-primary", label);
        statusButton.type = "button";
        statusButton.addEventListener("click", function() {
          changeOrderStatus_(order, next, statusButton, "Saving…", "Order status updated.");
        });
        actions.append(statusButton);
      }
      if (!["completed", "cancelled"].includes(order.status)) {
        const paymentButton = element("button", "btn btn-sm btn-secondary", "Record payment");
        paymentButton.type = "button";
        paymentButton.addEventListener("click", function() { openPaymentDialog(order); });
        actions.append(paymentButton);
        const cancel = element("button", "cancel-button", "Cancel order");
        cancel.type = "button";
        cancel.addEventListener("click", function() {
          if (window.confirm("Cancel this order? It will remain in history.")) {
            changeOrderStatus_(order, "cancelled", cancel, "Cancelling…", "Order cancelled.");
          }
        });
        actions.append(cancel);
      }
    }
    // Request 1: view / reprint the receipt of any order, including completed and cancelled ones.
    if (!pendingOrderSaves[order.id]) {
      const receiptButton = element("button", "receipt-reprint-button");
      receiptButton.innerHTML = '<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4V11a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7h-2M6 14h12v7H6z"/></svg>';
      receiptButton.append(document.createTextNode("View / reprint receipt"));
      receiptButton.type = "button";
      receiptButton.addEventListener("click", function() {
        showReceipt(order, { reprint: !order.request_id });
      });
      actions.append(receiptButton);
    }
    card.append(actions);
    return card;
  }

  // ---- Busy buttons: every button that waits for the server shows a spinner ----
  function setButtonBusy_(button, label) {
    if (!button || button.getAttribute("aria-busy") === "true") return;
    button.dataset.idleContent = button.innerHTML;
    button.style.minWidth = button.offsetWidth ? button.offsetWidth + "px" : "";
    button.disabled = true;
    button.setAttribute("aria-busy", "true");
    button.replaceChildren(element("span", "button-spinner"), element("span", "", label || "Working…"));
    button.firstChild.setAttribute("aria-hidden", "true");
  }

  function clearButtonBusy_(button) {
    if (!button || button.getAttribute("aria-busy") !== "true") return;
    button.innerHTML = button.dataset.idleContent || "";
    button.disabled = false;
    button.removeAttribute("aria-busy");
    button.style.minWidth = "";
  }

  async function withBusyButton_(button, label, work) {
    setButtonBusy_(button, label);
    try {
      return await work();
    } finally {
      clearButtonBusy_(button);
    }
  }

  function getQueuedOrderPreviews() {
    if (!State.pendingActions) return [];
    return State.pendingActions.filter(function(action) {
      return action.method === "createOrder" && action.preview;
    }).map(function(action) {
      return Object.assign({}, action.preview, {
        id: action.request_id,
        request_id: action.request_id,
        order_number: "Pending sync",
        status: "pending_sync",
        created_at: action.created_at
      });
    });
  }

  function renderProducts() {
    renderCatalogTable("products-table", State.data.products || [], "No products yet.");
  }

  function renderAddOns() {
    renderCatalogTable("addons-table", State.data.addOns || [], "No add-ons yet.");
  }

  function renderCatalogTable(containerId, records, emptyMessage) {
    const container = byId(containerId);
    container.replaceChildren();
    if (!records.length) {
      container.append(element("p", "muted", emptyMessage));
      return;
    }
    const isProductTable = containerId === "products-table";
    const table = createTable(isProductTable
      ? ["Photo", "Product", "Category", "USD", "KHR", "Stock link"]
      : ["Photo", "Add-on", "USD", "KHR", "Stock link"]);
    // Presentation: size shown under the name; numeric columns right-aligned.
    const headCells = table.tHead.rows[0].cells;
    const usdIndex = isProductTable ? 3 : 2;
    if (isProductTable) headCells[2].className = "hide-sm";
    headCells[usdIndex].className = "num";
    headCells[usdIndex + 1].className = "num";
    headCells[usdIndex + 2].className = "hide-sm";
    const rate = Fx.rate();
    records.forEach(function(record) {
      const row = table.insertRow();
      const noUsd = record.price_usd_minor === "" || record.price_usd_minor === undefined;
      if (noUsd) row.className = "warn";
      const photoCell = row.insertCell();
      photoCell.className = "catalog-photo-cell";
      photoCell.title = record.image || "No photo";
      photoCell.append(catalogImageElement_(record, isProductTable ? "product" : "add_on"));
      const nameCell = row.insertCell();
      nameCell.className = "name-cell";
      nameCell.append(element("b", "", record.name));
      if (isProductTable && record.size) nameCell.append(element("small", "", record.size));
      if (isProductTable) {
        const category = row.insertCell();
        category.className = "hide-sm";
        category.textContent = record.category || "—";
      }
      const usdCell = row.insertCell();
      usdCell.className = "num";
      if (noUsd) usdCell.append(element("span", "chip danger", "No USD price"));
      else usdCell.append(element("b", "", moneyFromMinor(record.price_usd_minor, "USD")));
      // KHR column shows the price the till will charge (USD × rate when a rate is set).
      const khrPrice = Fx.catalogPrice(record, "KHR");
      const khrCell = row.insertCell();
      khrCell.className = "num";
      khrCell.textContent = khrPrice === "" || khrPrice === undefined || khrPrice === null
        ? "—" : moneyFromMinor(khrPrice, "KHR");
      if (rate && !noUsd) khrCell.append(element("span", "auto", "from rate"));
      const linked = (State.data.inventoryItems || []).find(function(item) {

      card.classList.toggle("in-cart", State.cart.some(function(line) {

  // Photo from web/products/ (or an https link) when the item has one; otherwise, or if the photo
  // fails to load, the emoji icon. Same server rule as catalogImage_ in OrderService.gs.
  function catalogImageSrc_(image) {
    const value = String(image || "").trim();
    if (/^[A-Za-z0-9][A-Za-z0-9._-]{0,120}\.(png|jpe?g|webp|gif)$/i.test(value)) return "products/" + value;
    if (/^https:\/\/[^\s"'<>]+$/i.test(value)) return value;
    return "";
  }

  function catalogImageElement_(record, type) {
    const icon = element("span", "item-card-icon", getCatalogIcon(record, type));
    const src = catalogImageSrc_(record.image);
    if (!src) return icon;
    const image = document.createElement("img");
    image.className = "item-card-image";
    image.alt = "";
    image.loading = "lazy";
    image.decoding = "async";
    image.src = src;
    image.addEventListener("error", function() { image.replaceWith(icon); });
    return image;
  }

  function getCatalogIcon(record, type) {
    const itemText = (record.name + " " + (record.category || "")).toLowerCase();
    if (type === "add_on") {
      if (itemText.includes("candle")) return "🕯️";
      if (itemText.includes("box") || itemText.includes("gift")) return "🎁";
      if (itemText.includes("message") || itemText.includes("card")) return "💌";
      return "🎀";
    }
    if (itemText.includes("bread")) return "🍞";
    if (itemText.includes("cookie")) return "🍪";
    if (itemText.includes("pastry") || itemText.includes("croissant")) return "🥐";
    if (itemText.includes("cake")) return "🍰";
    return "🧁";
  }

  function renderCart() {
    const body = byId("cart-lines");
    body.replaceChildren();
    const currency = byId("order-currency").value;
    const quantityCount = State.cart.reduce(function(sum, item) { return sum + item.quantity; }, 0);
    text(byId("cart-item-count"), State.cart.length + " line(s) · " + quantityCount + " item(s)");
    if (!State.cart.length) {
      const row = body.insertRow();
      const cell = row.insertCell();
      cell.colSpan = 4;
      cell.className = "empty-cell";
      cell.textContent = "Tap a product card to start this order.";

      markCardsInCart_();
      renderOrderTotals();
      return;
    }
    let totalMinor = 0;
    State.cart.forEach(function(item, index) {
      const lineTotal = item.unit_price_minor * item.quantity;
      totalMinor += lineTotal;

      const nameCell = row.insertCell();

      nameCell.append(element("span", "cart-item-size",
        (item.variant ? item.variant + " · " : "") + moneyFromMinor(item.unit_price_minor, currency) + " each"));
      row.insertCell().append(element("span", "cart-qty", "× " + item.quantity));
      const amountCell = row.insertCell();
      amountCell.className = "cart-amt";
      amountCell.textContent = moneyFromMinor(lineTotal, currency);

      remove.type = "button";
      remove.setAttribute("aria-label", "Remove " + item.name + " from order");
      remove.addEventListener("click", function() {
        State.cart.splice(index, 1);
        renderCart();

  function addCartLine(record) {
    const type = byId("line-type").value;
    const currency = byId("order-currency").value;
    const quantity = Number(byId("line-quantity").value);
    if (!Number.isInteger(quantity) || quantity < 1) {
      throw new Error("Quantity must be a positive whole number.");
    }
    let line;
    if (type === "custom") {
      const price = String(byId("custom-price").value || "");
      const name = byId("custom-name").value.trim();
      if (!name || price === "") throw new Error("Enter a custom item name and unit price.");
      line = {
        item_type: "custom",
        name: name,
        unit_price: price,
        unit_price_minor: parseClientMoneyMinor(price, currency),
        quantity: quantity,
        variant: ""
      };
    } else {
      if (!record) throw new Error("Select an available catalog item.");
      const minor = Fx.catalogPrice(record, currency);
      if (minor === "" || minor === undefined) throw new Error("The item has no " + currency + " price.");
      line = {
        item_type: type,
        catalog_item_id: record.id,
        name: record.name,
        unit_price_minor: Number(minor),
        quantity: quantity,
        variant: type === "product" ? record.size || "" : ""
      };
    }
    State.cart.push(line);
    byId("line-quantity").value = "1";
    if (type === "custom") {
      byId("custom-name").value = "";
      byId("custom-price").value = "";
    }
    renderCart();
  }

  function parseClientMoneyMinor(value, currency) {
    const exponent = CURRENCY_EXPONENTS[currency];
    const textValue = String(value).trim();
    const pattern = exponent === 2 ? /^\d+(?:\.\d{1,2})?$/ : /^\d+$/;
    if (!pattern.test(textValue)) throw new Error(currency + " amount has invalid precision.");
    const parts = textValue.split(".");
    const minor = Number(parts[0]) * Math.pow(10, exponent) +
      (exponent ? Number(((parts[1] || "") + "00").slice(0, exponent)) : 0);
    if (!Number.isSafeInteger(minor)) throw new Error("Amount is out of range.");
    return minor;
  }

  function readPreviewMoney(value, currency) {
    if (value === "" || value === null || value === undefined) return 0;
    try {
      return parseClientMoneyMinor(value, currency);
    } catch (error) {
      return null;
    }
  }

  // True once the cashier types in "Amount Received"; until then it follows the order total.
  let receivedEdited = false;

  function setReceivedStep_() {
    const form = byId("order-form");
    form.elements.amount_received.step = form.elements.received_currency.value === "USD" ? "0.01" : "1";
  }

  function minorToInputValue_(minor, currency) {
    const exponent = CURRENCY_EXPONENTS[currency] || 0;
    return (Number(minor || 0) / Math.pow(10, exponent)).toFixed(exponent);
  }

  function renderOrderTotals() {
    if (!State.data) return;
    const form = byId("order-form");
    const currency = byId("order-currency").value;
    const receivedCurrency = form.elements.received_currency.value;
    const rate = Fx.rate();
    const step = Fx.step();
    const subtotal = State.cart.reduce(function(sum, item) {
      return sum + item.unit_price_minor * item.quantity;
    }, 0);
    const fee = readPreviewMoney(byId("delivery-fee").value, currency);
    const discount = readPreviewMoney(form.elements.discount.value, currency);
    const invalid = fee === null || discount === null || discount > subtotal;
    const taxBase = invalid ? 0 : subtotal - discount;
    const tax = Math.round(taxBase * Number(State.data.settings.tax_rate_basis_points || 0) / 10000);
    const total = invalid ? 0 : subtotal - discount + tax + fee;

    // Amount Received follows the total (in the chosen currency) until the cashier edits it.
    const totalInReceived = Fx.equivalent(total, currency, receivedCurrency, rate, step);
    if (!receivedEdited && totalInReceived !== null) {
      form.elements.amount_received.value = minorToInputValue_(totalInReceived, receivedCurrency);
    }
    const received = readPreviewMoney(form.elements.amount_received.value, receivedCurrency);
    const settlement = invalid || received === null
      ? null
      : Fx.settle(received, receivedCurrency, total, currency);

    text(byId("order-subtotal-preview"), moneyFromMinor(subtotal, currency));
    text(byId("order-delivery-preview"), fee === null ? "Check amount" : moneyFromMinor(fee, currency));
    text(byId("order-discount-preview"), discount === null ? "Check amount" : moneyFromMinor(discount, currency));
    text(byId("order-tax-preview"), moneyFromMinor(tax, currency));

    const totalKhr = Fx.equivalent(total, currency, "KHR", rate, step);
    const totalUsd = Fx.equivalent(total, currency, "USD", rate, step);
    text(byId("order-total-khr-preview"), invalid ? "Check entered amounts"
      : totalKhr === null ? "Set exchange rate" : moneyFromMinor(totalKhr, "KHR"));
    text(byId("order-total-usd-preview"), invalid ? "Check entered amounts"
      : totalUsd === null ? "Set exchange rate" : moneyFromMinor(totalUsd, "USD"));
    text(byId("order-received-preview"), received === null ? "Check amount" : moneyFromMinor(received, receivedCurrency));

    // Presentation: grey "no change due" box when there is no change; red balance when money is owed.
    const changeMinor = settlement && !settlement.error ? settlement.change_minor : 0;
    byId("order-change-box").classList.toggle("zero", !changeMinor);
    byId("order-balance-row").classList.toggle("due",
      Boolean(!settlement || settlement.error || total - settlement.applied_minor > 0) && State.cart.length > 0);
    if (Number(form.elements.discount.value || 0) > 0) byId("discount-field").hidden = false;
    syncAllSegments_();
    if (!settlement || settlement.error) {
      const message = settlement && settlement.error ? settlement.error : "Check entered amounts";
      text(byId("order-balance-preview"), message);
      text(byId("order-change-usd-preview"), "—");
      text(byId("order-change-khr-preview"), "—");
    } else {
      text(byId("order-balance-preview"), moneyFromMinor(total - settlement.applied_minor, currency));
      text(byId("order-change-usd-preview"), settlement.change.usd_minor === null
        ? "Set exchange rate" : moneyFromMinor(settlement.change.usd_minor, "USD"));
      text(byId("order-change-khr-preview"), settlement.change.khr_minor === null
        ? "Set exchange rate" : moneyFromMinor(settlement.change.khr_minor, "KHR"));
    }
    text(byId("order-rate-note"), rate
      ? "Exchange rate: 1 USD = " + moneyFromMinor(rate, "KHR") + " · KHR rounded to " +
        moneyFromMinor(step, "KHR") + "."
      : "No exchange rate set (Settings): only " + currency + " can be received.");
  }

  function phoneMatchKey(value) {
    return String(value || "").replace(/\D/g, "");
  }

  function scheduleCustomerLookup() {
    if (customerLookupTimer) window.clearTimeout(customerLookupTimer);
    const phone = byId("order-form").elements.customer_phone.value.trim();
    const phoneKey = phoneMatchKey(phone);
    const sequence = ++customerLookupSequence;
    const container = byId("customer-match");
    matchedCustomer = null;
    if (phoneKey.length < 5) {
      container.hidden = true;
      return;
    }

    container.hidden = false;
    byId("use-customer-match").hidden = true;
    const localMatch = findCachedCustomerByPhone(phoneKey);
    text(byId("customer-match-detail"), localMatch ? "" : "Checking previous orders for this phone…");
    customerLookupTimer = window.setTimeout(async function() {
      try {
        const customer = localMatch || (navigator.onLine && !State.ready.customers
          ? await DataService.findCustomerByPhone(phone)
          : null);
        if (sequence !== customerLookupSequence ||
            phoneMatchKey(byId("order-form").elements.customer_phone.value) !== phoneKey) return;
        matchedCustomer = customer;
        if (!customer) {
          text(byId("customer-match-detail"), "No previous customer record found for this phone.");
          return;
        }
        const detail = [
          customer.customer_name || "Name not saved",
          customer.location || "No saved location",
          customer.order_count + " previous order(s)"
        ];
        if (customer.last_order_at) {
          detail.push("Last order " + new Date(customer.last_order_at).toLocaleDateString());
        }
        text(byId("customer-match-detail"), "Found customer: " + detail.join(" · "));
        byId("use-customer-match").hidden = !customer.customer_name && !customer.location;
      } catch (error) {
        if (sequence !== customerLookupSequence) return;
        text(byId("customer-match-detail"), "Customer lookup failed: " + error.message);
        showNotice("Customer lookup failed: " + error.message, true);
      }
    }, localMatch ? 0 : 250);
  }

  // Looks the phone up in the customer list loaded with the app (no server call).
  function findCachedCustomerByPhone(phoneKey) {
    if (!State.data) return null;
    return (State.data.customers || []).find(function(entry) {
      return entry.phone_key === phoneKey;
    }) || null;
  }

  // Keeps the customer list current after a new order, without reloading it.
  function rememberCustomer_(order) {
    const key = phoneMatchKey(order.customer_phone);
    if (key.length < 5 || !State.data) return;
    const list = State.data.customers || (State.data.customers = []);
    let entry = list.find(function(item) { return item.phone_key === key; });
    if (!entry) {
      entry = { phone_key: key, customer_name: "", customer_phone: order.customer_phone, location: "", order_count: 0, last_order_at: "" };
      list.push(entry);
    }
    entry.order_count += 1;
    entry.last_order_at = order.created_at || new Date().toISOString();
    entry.customer_phone = order.customer_phone;
    if (order.customer_name) entry.customer_name = order.customer_name;
    if (order.location) entry.location = order.location;
  }

  function clearCustomerMatch() {
    customerLookupSequence += 1;
    if (customerLookupTimer) window.clearTimeout(customerLookupTimer);
    customerLookupTimer = null;
    matchedCustomer = null;
    byId("customer-match").hidden = true;
    byId("customer-match-detail").textContent = "";
    byId("use-customer-match").hidden = true;
  }

  function createOrderPreview(payload) {
    const subtotal = State.cart.reduce(function(sum, item) {
      return sum + item.unit_price_minor * item.quantity;
    }, 0);
    const currency = payload.currency;
    const discount = parseClientMoneyMinor(payload.discount || "0", currency);
    const deliveryFee = parseClientMoneyMinor(payload.delivery_fee || "0", currency);
    const tax = Math.round(
      Math.max(0, subtotal - discount) *
      Number(State.data.settings.tax_rate_basis_points || 0) / 10000
    );
    const total = Math.max(0, subtotal - discount + tax + deliveryFee);
    const received = parseClientMoneyMinor(payload.amount_received || "0", payload.received_currency);
    const settlement = received > 0
      ? Fx.settle(received, payload.received_currency, total, currency)
      : null;
    if (settlement && settlement.error) throw new Error(settlement.error);
    const paid = settlement ? settlement.applied_minor : 0;
    return {
      exchange_rate_khr_per_usd: Fx.rate(),
      last_settlement: settlement,
      payments: settlement ? [{
        amount_minor: paid, currency: currency, method: payload.payment_method, status: "completed",
        received_amount_minor: settlement.received_minor, received_currency: settlement.received_currency,
        exchange_rate_khr_per_usd: settlement.exchange_rate_khr_per_usd, change_minor: settlement.change_minor
      }] : [],
      order_number: "Pending sync",
      status: "pending_sync",
      created_at: new Date().toISOString(),
      customer_name: payload.customer_name || "Walk-in customer",
      customer_phone: payload.customer_phone,
      location: payload.location,
      order_channel: payload.order_channel,
      fulfillment_method: payload.fulfillment_method,
      pickup_at: payload.pickup_at,
      payment_method: payload.payment_method,
      currency: currency,
      subtotal_minor: subtotal,
      delivery_fee_minor: deliveryFee,
      discount_minor: discount,
      tax_minor: tax,
      total_minor: total,

          name_snapshot: item.name,

  async function submitOrder(event) {
    event.preventDefault();
    if (!State.cart.length) throw new Error("Add at least one item.");
    const form = byId("order-form");
    const formData = new FormData(form);
    const channel = formData.get("order_channel");
    const localPickup = formData.get("pickup_at");
    const currency = formData.get("currency");
    const customDetails = byId("order-type").value === "custom_cake" ? {
      flavor: byId("cake-flavor").value.trim(),
      size: byId("cake-size").value.trim(),
      inscription: byId("cake-inscription").value.trim()
    } : {};
    const payload = {
      customer_name: formData.get("customer_name"),
      customer_phone: formData.get("customer_phone"),
      order_type: formData.get("order_type"),
      order_channel: channel,
      fulfillment_method: channel === "grab" ? "delivery" : "pickup",
      pickup_at: localPickup ? new Date(localPickup).toISOString() : "",
      currency: currency,
      location: formData.get("location"),
      delivery_fee: formData.get("delivery_fee") || "0",
      discount: formData.get("discount") || "0",
      amount_received: formData.get("amount_received") || "0",
      received_currency: formData.get("received_currency") || currency,
      payment_method: formData.get("payment_method"),
      notes: formData.get("notes"),
      custom_details: customDetails,
      items: State.cart.map(function(item) {
        return item.item_type === "custom" ? {
          item_type: "custom",
          name: item.name,
          unit_price: item.unit_price,
          quantity: item.quantity,
          variant: item.variant
        } : {
          item_type: item.item_type,
          catalog_item_id: item.catalog_item_id,
          quantity: item.quantity,
          variant: item.variant
        };
      })
    };
    const preview = createOrderPreview(payload);
    const result = await DataService.createOrder(payload, preview);
    const receipt = result.queued
      ? preview
      : result;
    State.cart = [];
    form.reset();
    form.elements.currency.value = State.data.settings.default_currency || "USD";
    State.orderCurrency = form.elements.currency.value;
    form.elements.delivery_fee.step = State.orderCurrency === "USD" ? "0.01" : "1";
    form.elements.discount.step = State.orderCurrency === "USD" ? "0.01" : "1";
    form.elements.received_currency.value = State.orderCurrency;
    receivedEdited = false;
    setReceivedStep_();
    byId("custom-price").step = State.orderCurrency === "USD" ? "0.01" : "1";
    byId("cake-details").hidden = true;
    clearCustomerMatch();
    renderItemCards();
    renderCart();
    if (!result.queued) {
      upsertLocalOrder_(result);
      rememberCustomer_(result);
      if ((result.items || []).some(function(item) { return item.inventory_item_id; })) {
        loadSections_(["stock"], { force: true }).catch(function() {});
      }
    } else {
      rememberCustomer_(preview);
      updateQueueStatus();
    }
    showNotice((result.queued ? "Order queued on this device. It is not yet shared with other devices." : "Order saved.") +
      changeNoticeText_(receipt.last_settlement));
    showReceipt(receipt);
  }

  // " Give change: $7.63 / ៛31,300" (empty when no change is due).
  function changeNoticeText_(settlement) {
    if (!settlement || !settlement.change_minor) return "";
    return " Give change: " + Fx.bothText(settlement.change.usd_minor, settlement.change.khr_minor) + ".";
  }

  // options.reprint: opened again later from the Orders page (request 1).
  function showReceipt(order, options) {
    const opts = options || {};
    const currency = order.currency;
    const items = order.items || [];
    text(byId("receipt-order-number"), order.order_number || "Pending sync");
    text(byId("receipt-order-status"), order.request_id || order.status === "pending_sync"
      ? "Saved on this device; waiting to sync to the shop."
      : opts.reprint
        ? "REPRINT · printed " + new Date().toLocaleString() + " · status: " + String(order.status || "").replaceAll("_", " ")
        : "Order saved");
    byId("receipt-dialog").classList.toggle("is-reprint", Boolean(opts.reprint));

    const details = byId("receipt-customer-details");
    details.replaceChildren();
    const payment = (order.payments || []).find(function(record) {
      return record.status === "completed";
    });
    const detailRows = [
      ["Date", order.created_at ? new Date(order.created_at).toLocaleString() : new Date().toLocaleString()],
      ["Customer", order.customer_name || "Walk-in customer"],
      ["Phone", order.customer_phone || "—"],
      ["Order type", String(order.order_type || "walk_in").replaceAll("_", " ")],
      ["Fulfillment", String(order.order_channel || "") + " · " + String(order.fulfillment_method || "")],
      ["Pickup / delivery time", order.pickup_at ? new Date(order.pickup_at).toLocaleString() : "—"],
      ["Location", order.location || "—"],
      ["Payment method", payment ? payment.method.replaceAll("_", " ") : order.payment_method || "—"]
    ];
    detailRows.forEach(function(pair) {
      details.append(element("dt", "", pair[0]));
      details.append(element("dd", "", pair[1]));
    });

    const itemBody = byId("receipt-items");
    itemBody.replaceChildren();
    items.forEach(function(item) {
      const row = itemBody.insertRow();
      row.insertCell().textContent = item.name_snapshot + (item.variant ? " · " + item.variant : "");
      row.insertCell().textContent = String(item.quantity);
      row.insertCell().textContent = moneyFromMinor(
        item.line_total_minor === undefined
          ? Number(item.unit_price_minor || 0) * Number(item.quantity || 0)
          : item.line_total_minor,
        currency
      );
    });

    const totals = byId("receipt-totals");
    totals.replaceChildren();
    const addTotalRow = function(label, amountText, className) {
      const row = element("div", className || "");
      row.append(element("span", "", label));
      row.append(element("strong", "", amountText));
      totals.append(row);
    };
    addTotalRow("Items subtotal", moneyFromMinor(Number(order.subtotal_minor || 0), currency));
    // Presentation: zero Delivery fee / Discount rows are hidden on the receipt.
    addTotalRow("Delivery fee", moneyFromMinor(Number(order.delivery_fee_minor || 0), currency),
      Number(order.delivery_fee_minor || 0) ? "" : "is-zero");
    const discount = Number(order.discount_minor || 0);
    addTotalRow("Discount", (discount ? "-" : "") + moneyFromMinor(discount, currency), discount ? "" : "is-zero");
    addTotalRow("Tax", moneyFromMinor(Number(order.tax_minor || 0), currency));
    // KHR total above USD total, using the rate the order was made with (request 2c).
    const orderRate = Number(order.exchange_rate_khr_per_usd || 0);
    const step = Fx.step();
    const total = Number(order.total_minor || 0);
    const totalKhr = Fx.equivalent(total, currency, "KHR", orderRate, step);
    const totalUsd = Fx.equivalent(total, currency, "USD", orderRate, step);
    if (totalKhr !== null) addTotalRow("Total (KHR)", moneyFromMinor(totalKhr, "KHR"), "receipt-grand-total");
    if (totalUsd !== null) addTotalRow("Total (USD)", moneyFromMinor(totalUsd, "USD"), "receipt-grand-total");
    if (orderRate) addTotalRow("Exchange rate", "1 USD = " + moneyFromMinor(orderRate, "KHR"), "rate");

    // Each payment: what was handed over and the change given (both currencies).
    (order.payments || []).filter(function(record) { return record.status === "completed"; })
      .forEach(function(record) {
        const receivedCurrency = record.received_currency || record.currency;
        const receivedMinor = record.received_amount_minor === undefined || record.received_amount_minor === ""
          ? record.amount_minor : record.received_amount_minor;
        addTotalRow("Received" + (record.paid_at ? " " + new Date(record.paid_at).toLocaleDateString() : "") +
          " (" + String(record.method || "").replaceAll("_", " ") + ")",
          moneyFromMinor(Number(receivedMinor || 0), receivedCurrency));
        const changeMinor = Number(record.change_minor || 0);
        if (changeMinor) {
          const paymentRate = Number(record.exchange_rate_khr_per_usd || orderRate || 0);
          const both = Fx.changeBoth(changeMinor, receivedCurrency, paymentRate, step);
          addTotalRow("Change", Fx.bothText(both.usd_minor, both.khr_minor), "receipt-change");
        }
      });

    const paid = Number(order.amount_paid_minor || 0);
    const due = order.balance_due_minor === undefined
      ? Math.max(total - paid, 0)
      : Number(order.balance_due_minor);
    text(byId("receipt-payment-state"),
      "Paid " + moneyFromMinor(paid, currency) + " · Balance due " + moneyFromMinor(due, currency));
    const dialog = byId("receipt-dialog");
    if (!dialog.open) dialog.showModal();
  }

  function createTable(headers) {
    const table = element("table", "table");

  async function loadPriceHistory() {
    const itemId = byId("price-history-item").value;
    const tableContainer = byId("price-history-table");
    const chart = byId("price-history-chart");
    tableContainer.replaceChildren();
    chart.replaceChildren();
    if (!itemId) return;
    try {
      const history = await DataService.getPriceHistory(itemId);
      renderPriceChart(history);
      if (!history.length) {
        tableContainer.append(element("p", "muted", "No recorded quotes or purchases for this item."));
        return;
      }
      const unit = ((State.data.inventoryItems || []).find(function(item) { return item.id === itemId; }) || {}).base_unit || "";
      const table = createTable(["Date", "Type", "Supplier", "Quantity", "Total cost", "Unit cost", "Currency"]);
      history.forEach(function(entry) {
        const row = table.tBodies[0].insertRow();
        row.insertCell().textContent = new Date(entry.date).toLocaleDateString();
        row.insertCell().textContent = entry.type === "purchase" ? "Received purchase" : "Quote";
        row.insertCell().textContent = entry.supplier_name;
        row.insertCell().textContent = formatQuantity(entry.quantity_base_milli) + " " + unit;
        row.insertCell().textContent = moneyFromMinor(entry.total_cost_minor, entry.currency);
        const baseQuantity = Number(entry.quantity_base_milli) / 1000;
        const totalMajor = Number(entry.total_cost_minor) / Math.pow(10, CURRENCY_EXPONENTS[entry.currency]);
        row.insertCell().textContent = baseQuantity
          ? moneyFromMajor(totalMajor / baseQuantity, entry.currency) + " / " + unit
          : "—";
        row.insertCell().textContent = entry.currency;
      });
      tableContainer.append(table);
    } catch (error) {
      showNotice(error.message, true);
    }
  }

  function renderPriceChart(entries) {
    const container = byId("price-history-chart");
    const currencies = Array.from(new Set(entries.map(function(entry) { return entry.currency; })));
    if (!entries.length) return;
    currencies.forEach(function(currency) {
      const series = entries.filter(function(entry) { return entry.currency === currency; })
        .slice().sort(function(a, b) { return new Date(a.date) - new Date(b.date); });
      if (series.length < 2) {
        container.append(element("p", "muted", currency + ": add another quote or purchase to see a trend."));
        return;
      }
      const values = series.map(function(entry) {
        return Number(entry.total_cost_minor) / (Number(entry.quantity_base_milli) / 1000);
      });
      const min = Math.min.apply(null, values);
      const max = Math.max.apply(null, values);
      const width = 620, height = 130, pad = 14;
      const points = values.map(function(value, index) {
        const x = pad + index * (width - 2 * pad) / (values.length - 1);
        const y = height - pad - (max === min ? 0.5 : (value - min) / (max - min)) * (height - 2 * pad);
        return x + "," + y;
      }).join(" ");
      const wrapper = element("div", "chart-series");
      wrapper.append(element("p", "muted", currency + " unit price per base unit"));
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      line.setAttribute("points", points);
      line.setAttribute("fill", "none");
      line.setAttribute("stroke", "#7a4b2a");
      line.setAttribute("stroke-width", "3");
      svg.append(line);
      wrapper.append(svg);
      container.append(wrapper);
    });
  }

  let paymentDialogOrder = null;

  // Record payment: the amount received can be in USD or KHR and may be more than the balance
  // (the change is shown). It starts filled with the balance due.
  function openPaymentDialog(order) {
    const dialog = byId("payment-dialog");
    const form = byId("payment-form");
    paymentDialogOrder = order;
    form.elements.order_id.value = order.id;
    form.elements.currency.value = order.currency;

  function fillPaymentAmount_() {
    const order = paymentDialogOrder;
    if (!order) return;
    const form = byId("payment-form");
    const payCurrency = form.elements.currency.value;
    form.elements.amount.step = payCurrency === "USD" ? "0.01" : "1";
    form.elements.amount.removeAttribute("max");
    const due = Fx.equivalent(order.balance_due_minor, order.currency, payCurrency, Fx.rate(), Fx.step());
    form.elements.amount.value = due === null ? "" : minorToInputValue_(due, payCurrency);
    const dueKhr = Fx.equivalent(order.balance_due_minor, order.currency, "KHR", Fx.rate(), Fx.step());
    const dueUsd = Fx.equivalent(order.balance_due_minor, order.currency, "USD", Fx.rate(), Fx.step());
    text(byId("payment-order-context"),
      order.order_number + " · remaining balance " + Fx.bothText(dueUsd, dueKhr));
    renderPaymentChange_();
  }

  function renderPaymentChange_() {
    const order = paymentDialogOrder;
    if (!order) return;
    const form = byId("payment-form");
    const payCurrency = form.elements.currency.value;
    const preview = byId("payment-change-preview");
    preview.replaceChildren();
    preview.classList.remove("error", "zero");
    syncAllSegments_();
    const received = readPreviewMoney(form.elements.amount.value, payCurrency);
    if (received === null) { preview.classList.add("error"); text(preview, "Check amount"); return; }
    const settlement = Fx.settle(received, payCurrency, order.balance_due_minor, order.currency);
    if (settlement.error) { preview.classList.add("error"); text(preview, settlement.error); return; }
    const remaining = Number(order.balance_due_minor) - settlement.applied_minor;
    // Presentation: same values as before, split into a "Change" line and a "Still due" line.
    preview.classList.toggle("zero", !settlement.change_minor);
    const top = element("div", "top");
    top.append(element("span", "lbl", "Change"));
    top.append(element("strong", "", settlement.change_minor
      ? Fx.bothText(settlement.change.usd_minor, settlement.change.khr_minor)
      : "No change due"));
    preview.append(top);
    const still = element("div", "still");
    still.append(element("span", "", "Still due after this payment"));
    still.append(element("b", remaining > 0 ? "due" : "", moneyFromMinor(remaining, order.currency)));
    preview.append(still);
  }

  async function updateQueueStatus() {
    try {
      const currentStaffId = State.data && State.data.currentUser
        ? State.data.currentUser.id : "";
      State.pendingActions = (await DataService.getPendingActions()).filter(function(action) {
        return currentStaffId && action.created_by === currentStaffId;
      });
      const count = State.pendingActions.length;
      text(byId("pending-count"), count ? count + " action(s) waiting on this device." : "No pending offline actions.");
      setConnectionState(!navigator.onLine);
      renderOrders();
    } catch (error) {
      showNotice("Offline queue is unavailable: " + error.message, true);
    }
  }

  async function runAction(action, form, pendingMessage) {
    const message = pendingMessage || "Working…";
    const submit = form ? form.querySelector('button[type="submit"]') : null;
    const originalContent = submit ? submit.innerHTML : "";
    if (submit) {
      submit.disabled = true;
      submit.setAttribute("aria-busy", "true");
      submit.innerHTML = '<span class="button-spinner" aria-hidden="true"></span><span>' +
        message + "</span>";
    }
    showNotice(message, false, true);
    try {
      await action();
      if (byId("notice").textContent === message) showNotice("Complete.");
    } catch (error) {
      showNotice(error.message, true);
    } finally {
      if (submit) {
        submit.disabled = false;
        submit.removeAttribute("aria-busy");
        submit.innerHTML = originalContent;
      }
    }
  }

      ["Sales KHR", moneyFromMinor(report.totals.KHR.sales_minor, "KHR")],

  // ---- Staff session kept for this browser tab only (survives a page refresh, cleared when
  // the tab closes or on Switch user). The Google token is never stored.
  const SESSION_STORAGE_KEY = "bakeryPos.staffSession";

  function rememberSession_(token, screen) {
    try {
      if (!token || token === STAFF_LOGIN_DISABLED_TOKEN) {
        if (!token) window.sessionStorage.removeItem(SESSION_STORAGE_KEY);
        return;
      }
      window.sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
        token: token,
        screen: screen || State.activeScreen || "dashboard"
      }));
    } catch (error) {
      // Storage can be blocked (private mode): the app simply asks for the password again.
    }
  }

  function readRememberedSession_() {
    try {
      const value = JSON.parse(window.sessionStorage.getItem(SESSION_STORAGE_KEY) || "null");
      return value && typeof value.token === "string" && value.token ? value : null;
    } catch (error) {
      return null;
    }
  }

  function forgetSession_() {
    try { window.sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (error) { /* ignore */ }
  }

  async function signIn_() {
    const button = byId("sign-in-button");
    const error = byId("sign-in-error");
    setButtonBusy_(button, "Connecting…");
    error.hidden = true;
    try {
      await getAccessToken_();
      // After a page refresh in the same tab: go straight back in, no password.
      const remembered = readRememberedSession_();
      if (remembered) {
        staffSessionToken = remembered.token;
        if (PAGE_SECTIONS[remembered.screen]) State.activeScreen = remembered.screen;
        try {
          clearButtonBusy_(button);
          setButtonBusy_(button, "Opening…");
          await enterApp_(null);
          return;
        } catch (resumeError) {
          staffSessionToken = "";
          forgetSession_();
        }
      }
      clearButtonBusy_(button);
      // Show the username form at once; the server check runs while the user types and also
      // prepares the page data, so signing in is quick.
      showStaffLoginForm_();
      DataService.getAuthConfig(Object.assign({ warm: true }, landingSections_()))
        .then(function(authConfig) {
          staffLoginDisabled = Boolean(authConfig && authConfig.staffLoginEnabled === false);
          if (staffLoginDisabled && !staffSessionToken) {
            staffSessionToken = STAFF_LOGIN_DISABLED_TOKEN;
            byId("staff-login-form").hidden = true;
            return enterApp_(authConfig.startup);
          }
          return null;
        })
        .catch(function() {
          // Older API deployments have no getAuthConfig: the staff sign-in form is already shown.
        });
    } catch (loginError) {
      staffSessionToken = "";
      button.hidden = false;
      error.hidden = false;
      text(error, loginError.message);
    } finally {
      clearButtonBusy_(button);
    }
  }

  async function signInStaff_(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector('button[type="submit"]');

      error.hidden = false;

  // =================================================================================================
  // Presentation helpers (redesign). These only show/hide, restyle, or forward clicks to existing
  // controls and functions. They never change calculations, server calls or the offline queue.
  // =================================================================================================
  let syncPillBusy_ = false;
  const STALE_AFTER_MS_ = 10 * 60 * 1000;

  function minutesAgoText_(time) {
    if (!time) return "";
    const minutes = Math.floor((Date.now() - time) / 60000);
    if (minutes < 1) return "just now";
    if (minutes < 60) return minutes + " min ago";
    const hours = Math.floor(minutes / 60);
    return hours + " h ago";
  }

  // Sync pill states: ok | stale | busy | offline | sign-in expired. Uses existing state only.
  function updateSyncPill_() {
    const pill = byId("refresh-button");
    const action = byId("sync-action");
    const expiredBanner = byId("banner-expired");
    if (!pill) return;
    const signedIn = Boolean(State.data && State.data.currentUser);
    pill.hidden = !signedIn;
    action.hidden = true;
    expiredBanner.hidden = true;
    if (!signedIn) {
      byId("banner-overdue").hidden = true;
      byId("nav-orders-count").hidden = true;
      return;
    }
    const label = pill.querySelector(".sync-label");
    const time = pill.querySelector(".sync-time");
    const setPill = function(kind, labelText, timeText, disabled) {
      pill.className = "sync " + kind;
      label.textContent = labelText;
      time.textContent = timeText ? " · " + timeText : "";
      pill.disabled = Boolean(disabled);
    };
    const queued = (State.pendingActions || []).length;
    const expired = !accessToken || Date.now() >= accessTokenExpiresAt;
    if (syncPillBusy_ || refreshInFlight) {
      setPill("busy", "Refreshing…", "", true);
    } else if (!navigator.onLine) {
      setPill("off", "Offline", queued + " queued", true);
    } else if (expired) {
      setPill("err", "Sign-in expired", "", true);
      action.hidden = false;
      action.className = "sync-btn danger";
      action.dataset.action = "reconnect";
      action.querySelector("span").textContent = "Reconnect";
      expiredBanner.hidden = false;
    } else if (lastRefreshAt && Date.now() - lastRefreshAt > STALE_AFTER_MS_) {
      setPill("stale", "Last synced", minutesAgoText_(lastRefreshAt), false);
      action.hidden = false;
      action.className = "sync-btn warning";
      action.dataset.action = "refresh";
      action.querySelector("span").textContent = "Refresh";
    } else {
      setPill("ok", "Synced", minutesAgoText_(lastRefreshAt), false);
    }
  }

  // Segmented control over a real <select data-seg>. The select stays in the form (names unchanged);
  // a click sets its value and fires the same "change" event the old select fired.
  function enhanceSegments_() {
    document.querySelectorAll("select[data-seg]:not(.is-enhanced)").forEach(function(select) {
      const seg = element("span", "seg");
      seg.setAttribute("role", "radiogroup");
      Array.from(select.options).forEach(function(option) {
        const button = element("button", "", option.textContent);
        button.type = "button";
        button.dataset.value = option.value;
        button.setAttribute("role", "radio");
        button.addEventListener("click", function() {
          if (select.disabled) return;
          if (select.value !== option.value) {
            select.value = option.value;
            select.dispatchEvent(new Event("change", { bubbles: true }));
          }
          syncSegment_(select);
        });
        seg.append(button);
      });
      select.classList.add("is-enhanced");
      select.tabIndex = -1;
      select.setAttribute("aria-hidden", "true");
      select.after(seg);
      select._seg = seg;
      select.addEventListener("change", function() { syncSegment_(select); });
      syncSegment_(select);
    });
  }

  function syncSegment_(select) {
    if (!select._seg) return;
    select._seg.querySelectorAll("button").forEach(function(button) {
      const on = button.dataset.value === select.value;
      button.classList.toggle("on", on);
      button.setAttribute("aria-checked", String(on));
      button.disabled = select.disabled;
    });
  }

  function syncAllSegments_() {
    document.querySelectorAll("select.is-enhanced").forEach(syncSegment_);
  }

  // Tabs: show the matching panel, hide the other panels of the same tab group.
  function activateTab_(panelId) {
    const tab = document.querySelector('.tab[data-tab="' + panelId + '"]');
    if (!tab) return;
    const group = tab.closest("[data-tabs]");
    group.querySelectorAll(".tab").forEach(function(other) {
      const on = other === tab;
      other.classList.toggle("on", on);
      other.setAttribute("aria-selected", String(on));
      const panel = byId(other.dataset.tab);
      if (panel) panel.hidden = !on;
    });
    if (tab.dataset.addLabel) {
      const add = byId("catalog-add-button");
      add.textContent = tab.dataset.addLabel;
      add.dataset.openDialog = tab.dataset.addDialog;
    }
  }

  function bindPresentation_() {
    enhanceSegments_();
    // Shortcut buttons ("+ New order", "Go to Stock", banner "View orders").
    document.querySelectorAll("[data-goto]").forEach(function(button) {
      button.addEventListener("click", function() { showScreen(button.dataset.goto); });
    });
    // Drawers and modals.
    document.addEventListener("click", function(event) {
      const opener = event.target.closest("[data-open-dialog]");
      if (opener) {
        const dialog = byId(opener.dataset.openDialog);
        if (dialog && !dialog.open) dialog.showModal();
        return;
      }
      const closer = event.target.closest("[data-close-dialog]");
      if (closer) {
        const dialog = closer.closest("dialog");
        if (dialog) dialog.close();
      }
    });
    document.querySelectorAll("dialog").forEach(function(dialog) {
      // Click on the dimmed backdrop closes drawers and modals.
      dialog.addEventListener("click", function(event) {
        if (event.target === dialog) dialog.close();
      });
    });
    // Forms in drawers reset only after a successful save: close the drawer then.
    document.querySelectorAll("dialog.drawer form").forEach(function(form) {
      form.addEventListener("reset", function() {
        const dialog = form.closest("dialog");
        window.setTimeout(function() {
          if (dialog && dialog.open && dialog.id !== "payment-dialog") dialog.close();
          syncAllSegments_();
        }, 0);
      });
    });
    document.querySelectorAll("form").forEach(function(form) {
      form.addEventListener("reset", function() { window.setTimeout(syncAllSegments_, 0); });
    });
    // Tabs.
    document.querySelectorAll(".tab[data-tab]").forEach(function(tab) {
      tab.addEventListener("click", function() {
        activateTab_(tab.dataset.tab);
        if (tab.dataset.tab === "stock-history") loadPriceHistory();
      });
    });
    // Quantity stepper for #line-quantity.
    document.querySelectorAll(".step-btn").forEach(function(button) {
      button.addEventListener("click", function() {
        const input = byId("line-quantity");
        const value = Math.max(1, (parseInt(input.value, 10) || 1) + Number(button.dataset.step));
        input.value = String(value);
      });
    });
    // Discount "+ Add" reveals the existing discount field.
    byId("discount-toggle").addEventListener("click", function() {
      byId("discount-field").hidden = false;
      byId("order-form").elements.discount.focus();
    });
    // Order details overlay.
    byId("details-toggle").addEventListener("click", function() {
      setDetailsOpen_(byId("details-panel").hidden);
    });
    byId("details-done").addEventListener("click", function() { setDetailsOpen_(false); });
    ["order_type", "order_channel", "pickup_at"].forEach(function(name) {
      byId("order-form").elements[name].addEventListener("change", updateDetailsSummary_);
    });
    byId("order-form").addEventListener("reset", function() {
      window.setTimeout(function() {
        setDetailsOpen_(false);
        byId("discount-field").hidden = true;
      }, 0);
    });
    // The pinned New-order cart sits under the banners: track their height for the layout.
    const banners = document.querySelector(".banners");
    const setBannerHeight = function() {
      document.documentElement.style.setProperty("--banner-h", banners.offsetHeight + "px");
    };
    if (window.ResizeObserver) new ResizeObserver(setBannerHeight).observe(banners);
    setBannerHeight();
    // Keep "N min ago" and the stale state current. Display only: never loads data.
    window.setInterval(updateSyncPill_, 30000);
    window.addEventListener("online", updateSyncPill_);
    window.addEventListener("offline", updateSyncPill_);
    window.addEventListener("bakery:queue-updated", function() { window.setTimeout(updateSyncPill_, 0); });
    updateDetailsSummary_();
    updateSyncPill_();
  }

  async function startApp() {
    addLoadingPlaceholders_();
    bindForms();
    bindPresentation_();
    document.addEventListener("visibilitychange", refreshOnReturn_);
    window.addEventListener("focus", refreshOnReturn_);
    bindCurrencyPrecision();
    byId("sign-in-button").addEventListener("click", signIn_);
    byId("staff-login-form").addEventListener("submit", signInStaff_);
    byId("change-google-account").addEventListener("click", changeGoogleAccount_);
    byId("switch-account-button").addEventListener("click", switchAccount_);
    if (navigator.onLine) setSignedOutStatus_();
    else setConnectionState(true);
  }

  startApp();
</script>

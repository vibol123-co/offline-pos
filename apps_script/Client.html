    });
    byId("orders-more").addEventListener("click", function() {
      withBusyButton_(byId("orders-more"), "Loading…", function() {
        return searchOrderRange_(true);
      }).catch(function(error) { showNotice(error.message, true); });
    });
    byId("open-orders-toggle").addEventListener("click", function() {
      const list = byId("open-orders-list");
      list.hidden = !list.hidden;
      byId("open-orders-toggle").textContent = list.hidden ? "Show" : "Hide";
      byId("open-orders-toggle").setAttribute("aria-expanded", String(!list.hidden));
    });
    byId("order-detail-close").addEventListener("click", function() {
      byId("order-detail-dialog").close();
    });
    byId("order-detail-dialog").addEventListener("close", function() { detailOrderId = ""; });
    byId("product-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        const saved = await DataService.createProduct({
          name: values.get("name"),
          category: values.get("category"),
          size: values.get("size"),
          price_usd: values.get("price_usd"),
          price_khr: values.get("price_khr"),
          inventory_item_id: values.get("inventory_item_id")
        });
        form.reset();
        if (saved && !saved.queued) { State.data.products.push(saved); SECTION_RENDERERS.catalog(); }
        showNotice("Product saved.");
      }, form, "Saving product…");
    });
    byId("addon-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        const saved = await DataService.createAddOn({
          name: values.get("name"),
          price_usd: values.get("price_usd"),
          price_khr: values.get("price_khr"),
          inventory_item_id: values.get("inventory_item_id")
        });
        form.reset();
        if (saved && !saved.queued) { State.data.addOns.push(saved); SECTION_RENDERERS.catalog(); }
        showNotice("Add-on saved.");
      }, form, "Saving add-on…");
    });
    byId("supplier-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        const saved = await DataService.createSupplier({
          name: values.get("name"), phone: values.get("phone"),
          email: values.get("email"), notes: values.get("notes")
        });
        form.reset();
        if (saved && !saved.queued) { State.data.suppliers.push(saved); SECTION_RENDERERS.suppliers(); }
        showNotice("Supplier saved.");
      }, form, "Saving supplier…");
    });
    byId("inventory-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        const saved = await DataService.createInventoryItem({
          name: values.get("name"), category: values.get("category"),
          base_unit: values.get("base_unit"),
          low_stock_threshold: values.get("low_stock_threshold")
        });
        form.reset();
        if (saved && !saved.queued) { State.data.inventoryItems.push(saved); SECTION_RENDERERS.catalog(); }
        loadSections_(["stock"], { force: true }).catch(function() {});
        showNotice("Stock item saved.");
      }, form, "Saving stock item…");
    });
    byId("receive-stock-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        await DataService.receiveStock({
          supplier_id: values.get("supplier_id"),
          currency: values.get("currency"),
          reference: values.get("reference"),
          lines: [{
            inventory_item_id: values.get("inventory_item_id"),
            quantity: values.get("quantity"),
            total_cost: values.get("total_cost")
          }]
        });
        form.reset();
        await loadSections_(["stock"], { force: true });
        showNotice("Stock receipt saved.");
      }, form, "Posting stock receipt…");
    });
    byId("quote-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        const quoteDate = values.get("quoted_at");
        await DataService.recordSupplierPriceQuote({
          supplier_id: values.get("supplier_id"),
          inventory_item_id: values.get("inventory_item_id"),
          package_quantity: values.get("package_quantity"),
          price: values.get("price"),
          currency: values.get("currency"),
          quoted_at: quoteDate ? new Date(quoteDate + "T12:00:00").toISOString() : "",
          notes: ""
        });
        form.reset();
        loadPriceHistory();
        showNotice("Supplier price quote saved.");
      }, form, "Posting supplier quote…");
    });
    byId("stock-adjustment-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        await DataService.adjustStock({
          inventory_item_id: values.get("inventory_item_id"),
          movement_type: values.get("movement_type"),
          direction: values.get("direction"),
          quantity: values.get("quantity"),
          notes: values.get("notes")
        });
        form.reset();
        await loadSections_(["stock"], { force: true });
        showNotice("Stock adjustment saved.");
      }, form, "Saving adjustment…");
    });
    byId("price-history-item").addEventListener("change", loadPriceHistory);
    byId("stock-refresh").addEventListener("click", function() {
      withBusyButton_(byId("stock-refresh"), "", function() {
        return loadSections_(["stock"], { force: true });
      }).then(function() { showNotice("Stock refreshed."); })
        .catch(function(error) { showNotice(error.message, true); });
    });
    byId("report-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        const report = await DataService.getReports({
          from: values.get("from") ? new Date(values.get("from") + "T00:00:00").toISOString() : "",
          to: values.get("to") ? new Date(values.get("to") + "T00:00:00").toISOString() : ""
        });
        renderReport(report);
        showNotice("Report ready.");
      }, form, "Loading report…");
    });
    byId("settings-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        const settings = await DataService.updateSettings({
          default_currency: values.get("default_currency"),
          tax_rate_basis_points: values.get("tax_rate_basis_points")
        });
        if (settings && !settings.queued) {
          State.data.settings = settings;
          renderSections_([], true);
        }
        showNotice("Settings saved.");
      }, form, "Saving settings…");
    });
    byId("payment-cancel").addEventListener("click", function() { byId("payment-dialog").close(); });
    byId("receipt-close-button").addEventListener("click", function() { byId("receipt-dialog").close(); });
    byId("receipt-print-button").addEventListener("click", function() { window.print(); });
    byId("payment-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      runAction(async function() {
        const values = new FormData(form);
        const saved = await DataService.recordPayment(values.get("order_id"), {
          amount: values.get("amount"),
          method: values.get("method")
        });
        byId("payment-dialog").close();
        if (saved && !saved.queued) upsertLocalOrder_(saved);
        showNotice("Payment recorded.");
      }, form, "Posting payment…");
    });
    byId("staff-access-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const values = new FormData(form);
      runAction(async function() {
        const updated = await DataService.updateStaffAccess({
          id: values.get("id"),
          username: values.get("username"),
          display_name: values.get("display_name"),
          password: values.get("password"),
          role: values.get("role"),
          allowed_pages: values.getAll("allowed_pages"),
          active: values.get("active") === "on"
        });
        if (updated.session_invalidated) {
          await switchAccount_();
          text(byId("sign-in-error"), "Your password changed. Sign in again.");
          byId("sign-in-error").hidden = false;
          return;
        }
        form.reset();
        form.elements.id.value = "";
        form.elements.active.checked = true;
        form.elements.role.value = "cashier";
        updateStaffPageControls_();
        await loadSections_(["staff"], { force: true });
        showNotice("Staff access saved.");
      }, form, "Saving staff access…");
    });
    byId("staff-access-form").elements.role.addEventListener("change", updateStaffPageControls_);
    byId("staff-access-clear").addEventListener("click", function() {
      const form = byId("staff-access-form");
      form.reset();
      form.elements.id.value = "";
      form.elements.active.checked = true;
      updateStaffPageControls_();
    });
    window.addEventListener("online", function() {
      if (!State.data) {
        setSignedOutStatus_();
        return;
      }
      setConnectionState(false);
      DataService.flushPendingActions()
        .then(function() { lastRefreshAt = 0; refreshData(true); })
        .catch(function(error) {
          showNotice("Offline queue unavailable: " + error.message, true);
        });
    });
    window.addEventListener("offline", function() { setConnectionState(true); });
    window.addEventListener("bakery:queue-updated", updateQueueStatus);
    window.addEventListener("bakery:queue-error", function(event) {
      showNotice("A queued action needs attention: " + event.detail.message, true);
    });
  }

  function renderReport(report) {
    const container = byId("report-results");
    container.replaceChildren();
    const cards = [
      ["Orders", String(report.order_count)],
      ["Sales USD", moneyFromMinor(report.totals.USD.sales_minor, "USD")],
      ["Sales KHR", moneyFromMinor(report.totals.KHR.sales_minor, "KHR")],
      ["Low stock", String(report.low_stock_count)],
      ["Stock movements", String(report.movement_count)]
    ];
    cards.forEach(function(pair) {
      const card = element("article", "kpi-card");
      card.append(element("span", "", pair[0]));
      card.append(element("strong", "", pair[1]));
      container.append(card);
    });

    const activityContainer = byId("report-activity");
    activityContainer.replaceChildren();
    if (!report.staff_activity || !report.staff_activity.length) {
      activityContainer.append(element("p", "muted", "No staff activity is available for this period."));
      return;
    }
    const table = createTable(["Time", "Staff", "Action", "Record"]);
    report.staff_activity.forEach(function(entry) {
      const row = table.tBodies[0].insertRow();
      row.insertCell().textContent = new Date(entry.occurred_at).toLocaleString();
      row.insertCell().textContent = entry.actor_name + " (" + entry.actor_username + ")";
      row.insertCell().textContent = entry.action;
      row.insertCell().textContent = entry.entity_id || "—";
    });
    activityContainer.append(table);
  }

  function bindCurrencyPrecision() {
    document.querySelectorAll('input[name="price_usd"], input[name="total_cost"], input[name="price"]').forEach(function(input) {
      input.step = "0.01";
    });
    document.querySelectorAll('input[name="price_khr"]').forEach(function(input) {
      input.step = "1";
    });
  }

  function landingSections_() {
    return { sections: sectionsForPage_(State.activeScreen || "dashboard") };
  }

  async function signIn_() {
    const button = byId("sign-in-button");
    const error = byId("sign-in-error");
    setButtonBusy_(button, "Connecting…");
    error.hidden = true;
    try {
      await getAccessToken_();
      let authConfig = null;
      try {
        authConfig = await DataService.getAuthConfig(landingSections_());
      } catch (configError) {
        // Older API deployments have no getAuthConfig: fall back to the staff sign-in form.
        authConfig = null;
      }
      clearButtonBusy_(button);
      button.hidden = true;
      byId("change-google-account").hidden = false;
      staffLoginDisabled = Boolean(authConfig && authConfig.staffLoginEnabled === false);
      if (staffLoginDisabled) {
        staffSessionToken = STAFF_LOGIN_DISABLED_TOKEN;
        await enterApp_(authConfig.startup);
        return;
      }
      byId("staff-login-form").hidden = false;
      byId("staff-login-form").elements.username.focus();
      setSignedOutStatus_();
    } catch (loginError) {
      staffSessionToken = "";
      clearButtonBusy_(button);
      if (staffLoginDisabled) button.hidden = false;
      error.hidden = false;
      text(error, loginError.message);
    } finally {
      clearButtonBusy_(button);
    }
  }

  async function signInStaff_(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector('button[type="submit"]');
    const error = byId("sign-in-error");
    setButtonBusy_(button, "Signing in…");
    error.hidden = true;
    try {
      const values = new FormData(form);
      const session = await DataService.loginStaff(
        values.get("username"), values.get("password"), landingSections_()
      );
      staffSessionToken = session.sessionToken;
      form.elements.password.value = "";
      await enterApp_(session.startup);
    } catch (loginError) {
      staffSessionToken = "";
      error.hidden = false;
      text(error, loginError.message);
    } finally {
      clearButtonBusy_(button);
    }
  }

  // Opens the app straight away on the landing page. Its data normally arrives with the sign-in
  // reply; anything missing shows a spinner and loads in the background.
  async function enterApp_(startup) {
    State.data = emptyData_();
    State.ready = {};
    OrderView.live = true;
    OrderView.orders = null;
    const landing = sectionsForPage_(State.activeScreen);
    if (startup && !startup.error && startup.currentUser) {
      applySections_(startup, landing);
    } else {
      try {
        await loadSections_(landing.length ? landing : ["catalog"]);
      } catch (loadError) {
        staffSessionToken = "";
        State.data = null;
        throw loadError;
      }
    }
    lastRefreshAt = Date.now();
    byId("sign-in-panel").hidden = true;
    byId("app-shell").hidden = false;
    byId("refresh-button").hidden = false;
    byId("switch-account-button").hidden = false;
    setConnectionState(!navigator.onLine);
    applyPageAccess_();
    showScreen(State.activeScreen);
    renderSections_([], true);
    loadRemainingSections_();
    DataService.flushPendingActions()
      .catch(function(queueError) {
        showNotice("Could not sync pending actions: " + queueError.message, true);
      })
      .then(updateQueueStatus);
  }

  async function switchAccount_() {
    const error = byId("sign-in-error");
    error.hidden = true;
    try {
      if (staffSessionToken) await DataService.logoutStaff();
    } catch (logoutError) {
      error.hidden = false;
      text(error, "Signed out on this device; server session cleanup failed: " + logoutError.message);
    }
    staffSessionToken = "";
    State.data = null;
    State.ready = {};
    State.cart = [];
    byId("app-shell").hidden = true;
    byId("sign-in-panel").hidden = false;
    byId("refresh-button").hidden = true;
    byId("switch-account-button").hidden = true;
    byId("user-label").hidden = true;
    byId("staff-login-form").hidden = !accessToken || staffLoginDisabled;
    byId("sign-in-button").hidden = Boolean(accessToken) && !staffLoginDisabled;
    byId("change-google-account").hidden = !accessToken;
    byId("staff-login-form").elements.password.value = "";
    setSignedOutStatus_();
  }

  function changeGoogleAccount_() {
    const oldToken = accessToken;
    accessToken = "";
    accessTokenExpiresAt = 0;
    firstTokenRequest = true;
    tokenClient = null;
    staffSessionToken = "";
    byId("staff-login-form").hidden = true;
    byId("staff-login-form").reset();
    byId("change-google-account").hidden = true;
    byId("sign-in-button").hidden = false;
    byId("sign-in-error").hidden = true;
    setSignedOutStatus_();
    if (oldToken && window.google && google.accounts && google.accounts.oauth2) {
      google.accounts.oauth2.revoke(oldToken, function() {});
    }
  }

  async function startApp() {
    addLoadingPlaceholders_();
    bindForms();
    document.addEventListener("visibilitychange", refreshOnReturn_);
    window.addEventListener("focus", refreshOnReturn_);
    bindCurrencyPrecision();
    byId("sign-in-button").addEventListener("click", signIn_);
    byId("staff-login-form").addEventListener("submit", signInStaff_);
    byId("change-google-account").addEventListener("click", changeGoogleAccount_);
    byId("switch-account-button").addEventListener("click", switchAccount_);
    if (navigator.onLine) setSignedOutStatus_();
    else setConnectionState(true);
  }

  startApp();
</script>

name: Deploy Bakery POS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build static site
        env:
          POS_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.POS_GOOGLE_OAUTH_CLIENT_ID }}
          POS_API_EXECUTION_DEPLOYMENT_ID: ${{ vars.POS_API_EXECUTION_DEPLOYMENT_ID }}
        run: python scripts/build_github_pages.py --require-config

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
